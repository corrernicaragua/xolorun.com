    ['run', 'kid'],
    ['senior', 'kid', 'run'],
    ['you', 'run']
  ];
  const KIND = {
    run: { speed: 0.95, stride: 1.15, scale: 1 },
    you: { speed: 1.0, stride: 1.15, scale: 1.05 },
    kid: { speed: 0.8, stride: 1.0, scale: 0.64 },
    senior: { speed: 0.3, stride: 0.6, scale: 0.97 }
  };
  const FRAME_MS = 33;

  class TrackScene {
    constructor(section, opts) {
      this.section = section; this.opts = opts || {};
      this.canvas = section.querySelector('canvas.scene'); this.ctx = this.canvas.getContext('2d');
      this.spacer = section.querySelector('.track-space');
      this.runners = null; this.lastDraw = 0; this.raf = 0; this.visible = true; this.pulse = 0;
      this.still = reduceMotion();
      this.ro = new ResizeObserver(() => { this.layout(); this.draw(); });
      this.ro.observe(section);
      this.io = new IntersectionObserver((es) => { this.visible = es[0].isIntersecting; if (this.visible) this.play(); else this.pause(); });
      this.io.observe(this.canvas);
      this.layout(); this.draw(); this.play();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.draw());
    }
    play() { if (!this.still && !this.raf) this.raf = requestAnimationFrame((t) => this.tick(t)); }
    pause() { cancelAnimationFrame(this.raf); this.raf = 0; this.lastDraw = 0; }
    layout() {
      const W = this.section.clientWidth, pad = 34;
      const top = this.spacer.offsetTop - pad, hgt = this.spacer.offsetHeight + pad + 6;
      const dpr = Math.min(1.5, window.devicePixelRatio || 1);
      const prevW = this.W;
      this.W = W; this.H = hgt;
      this.canvas.style.top = top + 'px'; this.canvas.style.height = hgt + 'px';
      this.canvas.width = Math.round(W * dpr); this.canvas.height = Math.round(hgt * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.gap = this.spacer.offsetHeight / LANES.length;
      this.base = LANES.map((_, i) => pad + this.gap * (i + 1) - 2);
      this.unit = Math.max(26, Math.min(this.gap * 1.3, 96));
      this.fx = Math.round(W * 0.72);
      if (!this.runners) this.seed();
      else if (prevW && prevW !== W) this.runners.forEach((m) => { m.x *= W / prevW; if (m.stopAt) m.stopAt = W * 0.86; });
    }
    seed() {
      const rand = rng(11);
      const reps = Math.max(1, Math.round(this.W / 440));
      this.runners = [];
      LANES.forEach((kinds, li) => {
        const depth = 0.7 + li * 0.08, list = [];
        for (let r = 0; r < reps; r++) kinds.forEach((k) => { if (k !== 'you' || r === 0) list.push(k); });
        list.forEach((k, j) => {
          const K = KIND[k], h = this.unit * depth * K.scale, v = K.speed * h * 0.95;
          const m = { lane: li, kind: k, h, x: (j + 0.15 + rand() * 0.55) * (this.W / list.length), p: rand() * TAU, v, cad: v / (K.stride * h) * TAU };
          if (k === 'you') {
            if (this.opts.finish) {
              m.x = this.still ? this.W * 0.86 : this.W * 0.38;
              m.stopAt = this.W * 0.86; m.done = this.still; m.vmax = Math.max(60, (this.fx - m.x) / 1.4);
            } else m.x = this.W * 0.3;
          }
          this.runners.push(m);
        });
      });
    }
    tick(t) {
      this.raf = 0;
      if (!this.visible) return;
      if (t - this.lastDraw >= FRAME_MS) {
        const dt = this.lastDraw ? Math.min(0.1, (t - this.lastDraw) / 1000) : 0;
        this.lastDraw = t;
        if (!document.hidden) { this.step(dt); this.draw(); }
      }
      this.raf = requestAnimationFrame((n) => this.tick(n));
    }
    step(dt) {
      if (this.pulse > 0) this.pulse = Math.max(0, this.pulse - dt);
      for (const m of this.runners) {
        if (m.stopAt) {
          if (m.done) continue;
          const left = m.stopAt - m.x, speed = Math.min(m.vmax, Math.max(10, left * 2.6)), before = m.x;
          m.x = Math.min(m.stopAt, m.x + speed * dt);
          m.p += (speed / (1.15 * m.h)) * TAU * dt;
          if (before < this.fx && m.x >= this.fx) this.pulse = 0.6;
          if (m.stopAt - m.x < 0.8) m.done = true;
          continue;
        }
        m.x += m.v * dt; m.p += m.cad * dt;
        if (m.x - m.h > this.W) m.x = -m.h * 1.2;
      }
    }
    draw() {
      const c = this.ctx, W = this.W, H = this.H;
      c.clearRect(0, 0, W, H);
      const size = Math.round(Math.max(18, this.gap * 0.62));
      c.font = '600 ' + size + 'px ' + DISPLAY_FONT;
      this.base.forEach((y, i) => {
        c.fillStyle = tintOf(0.12 + i * 0.03);
        c.fillText(String(LANES.length - i), 12, y - 5);
        c.strokeStyle = tintOf(0.1 + i * 0.03); c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(0, y + 0.5); c.lineTo(W, y + 0.5); c.stroke();
      });
      if (this.opts.finish) {
        const y0 = this.base[0] - this.gap * 0.95, y1 = this.base[this.base.length - 1] + 3;
        c.strokeStyle = GOLD; c.lineWidth = 3 + 6 * (this.pulse / 0.6);
        c.beginPath(); c.moveTo(this.fx, y0); c.lineTo(this.fx, y1); c.stroke();
        c.fillStyle = GOLD; c.font = '600 15px ' + DISPLAY_FONT;
        c.textAlign = 'center'; c.fillText('META', this.fx, y0 - 8); c.textAlign = 'start';
      }
      for (const m of this.runners) {
        const you = m.kind === 'you';
        drawRunner(c, m.x, this.base[m.lane], m.h, m.p, you ? (m.done ? 'cheer' : 'run') : m.kind, you ? GOLD : tintOf(0.22 + m.lane * 0.07));
      }
    }
    destroy() { this.pause(); this.ro.disconnect(); this.io.disconnect(); }
  }

  class BandScene {
    constructor(holder, target, from, marks) {
      this.holder = holder; this.canvas = holder.querySelector('canvas'); this.ctx = this.canvas.getContext('2d');
      this.target = target; this.pos = reduceMotion() ? target : from; this.marks = marks; this.p = 0.9; this.last = 0; this.raf = 0;
      this.ro = new ResizeObserver(() => { this.layout(); this.draw(); });
      this.ro.observe(holder);
      this.layout(); this.draw();
      if (Math.abs(this.target - this.pos) > 0.002) this.raf = requestAnimationFrame((t) => this.tick(t));
    }
    layout() {
      const r = this.holder.getBoundingClientRect(), dpr = Math.min(1.5, window.devicePixelRatio || 1);
      this.W = r.width; this.H = r.height;
      this.canvas.width = Math.round(r.width * dpr); this.canvas.height = Math.round(r.height * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    tick(t) {
      const dt = this.last ? Math.min(0.05, (t - this.last) / 1000) : 0; this.last = t;
      this.pos += (this.target - this.pos) * (1 - Math.exp(-dt * 3.2));
      this.p += dt * 11;
      if (Math.abs(this.target - this.pos) <= 0.002) { this.pos = this.target; this.p = 0.9; this.raf = 0; this.draw(); return; }
      this.draw();
      this.raf = requestAnimationFrame((n) => this.tick(n));
    }
    draw() {
      const c = this.ctx, W = this.W, y = this.H - 9, x0 = 4, x1 = W - 6, span = x1 - x0;
      c.clearRect(0, 0, W, this.H);
      c.lineCap = 'round'; c.lineWidth = 3;
      c.strokeStyle = tintOf(0.12);
      c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
      const xr = x0 + span * this.pos;
      c.strokeStyle = tintOf(0.85);
      c.beginPath(); c.moveTo(x0, y); c.lineTo(Math.max(x0, xr), y); c.stroke();
      c.fillStyle = tintOf(0.45);
      this.marks.forEach((m) => { if (m > 0.01) { c.beginPath(); c.arc(x0 + span * m, y, 2.6, 0, TAU); c.fill(); } });
      c.strokeStyle = GOLD;
      c.beginPath(); c.moveTo(x1, y - 16); c.lineTo(x1, y + 5); c.stroke();
      drawRunner(c, Math.max(x0 + 8, Math.min(x1 - 12, xr)), y - 1.5, 30, this.p, 'run', GOLD);
    }
    destroy() { cancelAnimationFrame(this.raf); this.ro.disconnect(); }
  }

  // ───────── Motivación: tiempo que falta, puestos de abastecimiento y medalla de finalista ─────────
  const SECS_PER_Q = 11;
  function timeLeft() {
    const { path } = walk();
    const left = path.length - Math.max(0, path.indexOf(state.current));
    if (left <= 1) return 'Última pregunta';
    return 'Faltan ~' + Math.max(1, Math.round((left * SECS_PER_Q) / 60)) + ' min';
  }
  const CHEERS = {
    quarter: ['Buen ritmo.', 'Ya llevas un cuarto del recorrido.'],
    half: ['Mitad del recorrido.', 'Lo que nos cuentas decide qué construimos y qué no.'],
    last: ['Último tramo.', 'Ya casi cruzas la meta y te llevas tu medalla.']
  };
  // Se llama al llegar a una pregunta nueva: deja un mensaje si cruzó un hito que aún no había visto
  function checkMilestone() {
    state.cheer = null;
    if (Q[state.current].type === 'info') return;
    const { path } = walk();
    const i = Math.max(0, path.indexOf(state.current)), left = path.length - i, p = i / path.length;
    const seen = (k) => state.milestones.includes(k);
    let k = null;
    if (left <= 3 && path.length > 8 && !seen('last')) k = 'last';
    else if (p >= 0.5 && !seen('half')) k = 'half';
    else if (p >= 0.25 && p < 0.5 && !seen('quarter')) k = 'quarter';
    if (!k) return;
    state.milestones.push(k);
    state.cheer = k;
    setTimeout(() => announce(CHEERS[k].join(' ')), 400);
  }
  function cheerBox() {
    if (!state.cheer) return '';
    const c = CHEERS[state.cheer];
    return '<div class="cheer"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="15" cy="4.5" r="2.3" fill="currentColor"/><path d="M13 8.5l-3 4.5 3.5 2.5-1.5 5.5M10 13l-4 1M13.5 9.5l4 2 2-2.5M16 15.5l3 1.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><p><b>' + c[0] + '</b> ' + c[1] + '</p></div>';
  }

  // Imagen 1080 × 1920 para historias, con espacio para el sticker de enlace

    const wl = x.measureText('a la ').width; x.letterSpacing = '-2px'; x.font = 'italic 400 182px Newsreader'; x.fillStyle = '#1F6366'; x.fillText('meta', L - 6 + wl, 630);

      x.drawImage(im, cx - 100 * k, cy - 170 * k, 200 * k, 250 * k); } catch (e) {}

    x.letterSpacing = '6px'; x.fillStyle = '#BCD0D1'; x.font = '500 22px "Space Grotesk"'; x.fillText('FINALISTA', cx, cy + 44 * k); x.textAlign = 'start';

  // Código QR con la misma librería que usa el cartel; si no carga, la imagen lleva solo la dirección
  let qrLib = null;
  function loadQR() {

      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
      s.onload = () => ok(window.qrcode || null); s.onerror = () => ok(null);

  const fitFont = (x, text, weight, family, max, width) => {

    x.font = weight + ' ' + size + 'px ' + family; return size;
  };

  // Imagen para compartir: misma tipografía, pista y medalla de la encuesta, con la autoría siempre visible
  async function makeShareCanvas(format) {
    for (const f of ['700 200px "Space Grotesk"', '500 40px "Space Grotesk"', '500 44px Inter', '600 44px Inter', 'italic 400 200px Newsreader']) { try { await document.fonts.load(f); } catch (e) {} }
    const story = format === 'story', W = 1080, H = story ? 1920 : 1350, L = 80;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const x = cv.getContext('2d'), DISPLAY = '"Space Grotesk", sans-serif', BODY = 'Inter, sans-serif';
    const g = sh.mode === 'grupo', n = shName();
    x.fillStyle = '#F3EFE7'; x.fillRect(0, 0, W, H);
    x.textBaseline = 'alphabetic';
    // marca y autoría: el logo maestro (el nombre nunca se escribe con una fuente) y el nombre de la encuesta
    const top = story ? 210 : 130;
    try { const lg = await logoImg(); x.drawImage(lg, L, top - 52, 340, 340 * 190 / 1167.83); } catch (e) {}
    x.letterSpacing = '6px'; x.font = '500 30px ' + DISPLAY; x.fillStyle = '#9E4831'; x.fillText('CORRER EN NICARAGUA · ENCUESTA', L, top + 54);
    // titular
    x.letterSpacing = '-4px';
    const size = Math.min(fitFont(x, 'Cuéntanos', '700', DISPLAY, story ? 200 : 150, W - 2 * L), story ? 200 : 150);
    const lh = Math.round(size * 1.0); let y = top + 90 + lh;
    x.font = '700 ' + size + 'px ' + DISPLAY; x.fillStyle = '#12383B';
    x.fillText('Cuéntanos', L - 4, y); y += lh; x.fillText('cómo', L - 4, y); y += lh;
    x.letterSpacing = '-1px'; x.font = 'italic 400 ' + Math.round(size * 1.05) + 'px Newsreader'; x.fillStyle = '#1F6366'; x.fillText('corres', L - 4, y);
    x.letterSpacing = '0px'; x.font = '500 ' + (story ? 46 : 40) + 'px ' + BODY; x.fillStyle = '#4D6A6C';
    y += story ? 80 : 74; x.fillText('O cómo caminas, o cómo acompañas.', L, y);
    // pista con corredores
    const lanes = story ? 5 : 3, gap = story ? 56 : 50, y0 = y + (story ? 70 : 40);
    const kinds = [['run', 'senior', 'run'], ['kid', 'run', 'kid'], ['run', 'kid', 'senior'], ['senior', 'run', 'kid'], ['you', 'run', 'run']].slice(5 - lanes);
    for (let i = 0; i < lanes; i++) {
      const by = y0 + gap * (i + 1);
      x.strokeStyle = tintOf(0.1 + i * 0.04); x.lineWidth = 2; x.beginPath(); x.moveTo(0, by); x.lineTo(W, by); x.stroke();
      kinds[i].forEach((k, j) => {
        const K = KIND[k], h = gap * 1.25 * (0.75 + i * 0.06) * K.scale, you = k === 'you';
        drawRunner(x, 120 + j * 330 + (i % 2) * 140 + (you ? 120 : 0), by, h, 0.9 + i * 1.7 + j * 2.3, you ? 'run' : k, you ? '#C65A3D' : tintOf(0.25 + i * 0.07));
      });
    }
    y = y0 + gap * lanes;
    // datos
    const dot = (cx, cy) => { x.fillStyle = '#1F6366'; x.beginPath(); x.arc(cx, cy, 8, 0, Math.PI * 2); x.fill(); };
    const facts = ['3 a 8 minutos', 'Anónima', 'Sin nombre ni teléfono'];
    if (story) {
      y += 100;
      // los tres datos en una fila: la letra se ajusta al ancho
      x.font = '600 40px ' + BODY;
      const total = facts.reduce((a, f) => a + 28 + x.measureText(f).width, 0) + 40 * (facts.length - 1);
      const fs = Math.min(40, Math.floor(40 * (W - 2 * L) / total)); x.font = '600 ' + fs + 'px ' + BODY;
      const dg = fs * 1.0; let fx = L;
      facts.forEach((f) => { dot(fx + 8, y - fs * 0.32); x.fillStyle = '#12383B'; x.fillText(f, fx + 26, y); fx += 26 + x.measureText(f).width + dg; });
      y += 92;
      if (g) {
        x.fillStyle = '#1F6366'; fitFont(x, 'Compartida por ' + (n || 'nuestra comunidad'), '600', BODY, 42, W - 2 * L); x.fillText('Compartida por ' + (n || 'nuestra comunidad'), L, y);
        y += 54; x.fillStyle = '#4D6A6C'; fitFont(x, 'La encuesta es de ' + BRAND + ' y no vemos tus respuestas.', '500', BODY, 34, W - 2 * L); x.fillText('La encuesta es de ' + BRAND + ' y no vemos tus respuestas.', L, y);
      } else { x.fillStyle = '#4D6A6C'; x.font = '500 38px ' + BODY; x.fillText('Sirve aunque no corras carreras.', L, y); }
      // recuadro para el sticker de enlace
      const bw = W - 2 * L, bh = 120, bx = L, byy = Math.min(H - 300, y + 50);
      x.setLineDash([16, 12]); x.lineWidth = 4; x.strokeStyle = '#12383B'; x.beginPath(); x.roundRect(bx, byy, bw, bh, 24); x.stroke(); x.setLineDash([]);
      x.textAlign = 'center'; x.font = '600 42px ' + BODY; x.fillStyle = '#12383B'; x.fillText('Toca el enlace y cuéntanos', W / 2, byy + bh / 2 + 15); x.textAlign = 'start';
    } else {
      const qs = 300, qx = W - L - qs, qy = H - 70 - qs;
      let fy = qy + 50;
      x.font = '600 38px ' + BODY;
      facts.forEach((f) => { dot(L + 8, fy - 12); x.fillStyle = '#12383B'; x.fillText(f, L + 30, fy); fy += 60; });
      const tw = qx - L - 40;
      fy += 26;
      if (g) {
        x.fillStyle = '#1F6366'; fitFont(x, 'Compartida por ' + (n || 'nuestra comunidad'), '600', BODY, 32, tw); x.fillText('Compartida por ' + (n || 'nuestra comunidad'), L, fy);
        fy += 42; x.fillStyle = '#4D6A6C'; fitFont(x, 'No vemos tus respuestas.', '500', BODY, 30, tw); x.fillText('No vemos tus respuestas.', L, fy);
      } else { x.fillStyle = '#4D6A6C'; fitFont(x, 'xolorun.com/encuesta', '500', BODY, 32, tw); x.fillText('xolorun.com/encuesta', L, fy); }
      const lib = await loadQR();
      x.fillStyle = '#FFFFFF'; x.beginPath(); x.roundRect(qx, qy, qs, qs, 22); x.fill();
      if (lib) {
        const q = lib(0, 'M'); q.addData(shLink()); q.make();
        const m = q.getModuleCount(), pad = 22, cell = (qs - pad * 2) / m;
        x.fillStyle = '#12383B';
        for (let r = 0; r < m; r++) for (let c = 0; c < m; c++) if (q.isDark(r, c)) x.fillRect(qx + pad + c * cell, qy + pad + r * cell, Math.ceil(cell), Math.ceil(cell));
      } else { x.fillStyle = '#12383B'; x.textAlign = 'center'; x.font = '600 26px ' + BODY; x.fillText('Escanea', qx + qs / 2, qy + qs / 2); x.textAlign = 'start'; }
    }
    return cv;
  }

  async function saveCanvas(cv, name, text, btn) {
    const old = btn.lastChild.textContent; btn.lastChild.textContent = 'Preparando…';
    try {
      const blob = await new Promise((ok) => cv.toBlob(ok, 'image/png'));
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text }).catch(() => {});
      else {
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
      announce('Imagen lista.');
    } catch (e) { announce('No se pudo preparar la imagen. Intenta de nuevo.'); }
    btn.lastChild.textContent = old;
  }

  function render(dir) {
    scenes.forEach((s) => s.destroy()); scenes = [];
    document.documentElement.classList.toggle('big', state.big);
    let html;
    if (state.view === 'welcome') html = viewWelcome();
    else if (state.view === 'done') html = viewDone(false);
    else if (state.view === 'doneKids') html = viewDone(true);
    else if (state.view === 'about') html = viewAbout();
    else if (state.view === 'share') html = viewShare();
    else html = Q[state.current].type === 'info' ? viewInfo(state.current) : viewQuestion(state.current);
    app.innerHTML = html;
    if (dir === 'same') app.querySelectorAll('.enter').forEach((el) => el.classList.remove('enter'));
    app.querySelectorAll('[data-scene]').forEach((sec) => scenes.push(new TrackScene(sec, { finish: sec.dataset.scene === 'finish' })));
    const band = app.querySelector('.band-track');
    if (band) {
      const { p, path } = progress();
      const marks = []; let prevB = null;
      path.forEach((id, i) => { if (Q[id].b !== prevB) { marks.push(i / path.length); prevB = Q[id].b; } });
      scenes.push(new BandScene(band, p, dir === 'same' ? p : lastProgress, marks));
      lastProgress = p;
    } else if (state.view === 'welcome') lastProgress = 0;
    const title = app.querySelector('#qt');
    if (title && dir !== 'same') title.focus({ preventScroll: true });
    if (state.view === 'share') refreshShare(true);
    save();
  }

  // ───────── Acciones ─────────
  function say(msg) { state.hint = msg; render('same'); announce(msg); }
  function pushHistory(id) { if (state.history[state.history.length - 1] !== id) state.history.push(id); }
  function goNext() {
    if (state.view !== 'q') return;
    const q = Q[state.current], a = state.answers[state.current];
    if (q.optional && !isAnswered(q, a)) delete state.answers[state.current]; // saltada: no se guarda nada
    else if (q.type !== 'info' && !isAnswered(q, a)) {
      say(q.type === 'text' ? 'Escribe al menos una palabra para seguir. Si no hubo nada, escribe «nada».' : 'Elige una opción para seguir. Si no te acuerdas, elige «No me acuerdo».');
      return;
    }
    const nx = nextOf(state.current, a);
    state.hint = '';
    pushHistory(state.current);
    if (nx === 'END' || nx === 'END_KIDS') {
      state.final = finalAnswers();
      state.finisherNo = undefined; state.cheer = null;
      writeQueue(readQueue().filter((i) => i.client_id !== state.final.client_id).concat([state.final]));
      state.send = 'sending';
      state.view = nx === 'END' ? 'done' : 'doneKids';
      render(); window.scrollTo(0, 0); announce('Llegaste a la meta.');
      flush();
      return;
    }
    state.current = nx; checkMilestone(); render(); window.scrollTo(0, 0);
    sendProgress();
  }
  // Páginas de quiénes somos y para compartir: se abren encima de donde estabas y vuelven ahí
  const isPage = () => state.view === 'about' || state.view === 'share';
  function openPage(v) {
    if (!isPage()) state.prevView = state.view;
    state.view = v; render(); window.scrollTo(0, 0);
  }
  function closePage() {
    state.view = state.prevView || 'welcome'; state.prevView = null;
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    render(); window.scrollTo(0, 0);
  }
  function goBack() {
    state.hint = '';
    if (isPage()) { closePage(); return; }
    if (state.view === 'done' || state.view === 'doneKids') { state.view = 'welcome'; render(); return; }
    if (state.history.length) { state.current = state.history.pop(); render(); window.scrollTo(0, 0); }
    else { state.view = 'welcome'; render(); }
  }
  function restart() {
    try { localStorage.removeItem(STORE); } catch (e) {}
    Object.assign(state, { answers: {}, history: [], current: 'P1', hint: '', final: null, send: 'idle', shareFallback: false, view: 'q', clientId: uuid(), milestones: [], cheer: null, finisherNo: undefined });
    lastProgress = 0; render(); window.scrollTo(0, 0); sendProgress();
  }
  function pick(v) {
    const id = state.current, q = Q[id];
    if (q.type === 'single') { state.answers[id] = v; state.hint = ''; render('same'); return; }
    const cur = (state.answers[id] || []).slice();
    const op = q.options.find((x) => x.v === v);
    let next;
    if (cur.includes(v)) next = cur.filter((x) => x !== v);
    else if (op.ex) next = [v];
    else {
      next = cur.filter((x) => !(q.options.find((y) => y.v === x) || {}).ex);
      if (q.max && next.length >= q.max) { say('Puedes elegir hasta ' + q.max + '. Quita una para cambiarla.'); return; }
      next.push(v);
    }
    state.hint = '';
    if (next.length) state.answers[id] = next; else delete state.answers[id];
    render('same');
  }

  app.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    // Opciones del kit para compartir
    if (b.dataset.sm || b.dataset.sk || b.dataset.sw) {
      const k = b.dataset.sm ? 'sm' : b.dataset.sk ? 'sk' : 'sw', v = b.dataset[k];
      if (k === 'sm') sh.mode = v; else if (k === 'sk') sh.kind = v; else sh.where = v;
      render('same');
      const again = app.querySelector('[data-' + k + '="' + v + '"]'); if (again) again.focus({ preventScroll: true });
      return;
    }
    if (b.dataset.v) {
      const v = b.dataset.v;
      if (b.getAttribute('aria-disabled') === 'true') say('Puedes elegir hasta ' + Q[state.current].max + '. Quita una para cambiarla.');
      else pick(v);
      const again = app.querySelector('[data-v="' + v + '"]'); if (again) again.focus({ preventScroll: true });
      return;
    }
    if (act === 'start') { state.view = 'q'; state.current = 'P1'; state.clientId = uuid(); state.milestones = []; state.cheer = null; render(); window.scrollTo(0, 0); sendProgress(); }
    else if (act === 'resume') { state.view = 'q'; if (!state.clientId) state.clientId = uuid(); render(); sendProgress(); }
    else if (act === 'about') openPage('about');
    else if (act === 'kit') { if (!sh.mode) sh.mode = 'persona'; openPage('share'); }
    else if (act === 'kit-g') { sh.mode = 'grupo'; openPage('share'); }
    else if (act === 'home') closePage();
    else if (act === 'ssave') { if (shCanvas) saveCanvas(shCanvas, 'encuesta-correr-en-nicaragua-' + (sh.where === 'historia' ? 'historia' : 'publicacion') + '.png', shText(), b); }
    else if (act === 'scopy') {
      const ta = document.getElementById('stext');
      const ok = () => { b.lastChild.textContent = 'Texto copiado'; announce('Texto copiado. Pégalo en tu publicación.'); };
      const fail = () => { if (ta) { ta.focus({ preventScroll: true }); ta.select(); } announce('No se pudo copiar solo. El texto quedó seleccionado para que lo copies.'); };
      try { navigator.clipboard.writeText(ta ? ta.value : shText()).then(ok, fail); } catch (err) { fail(); }
    }
    else if (act === 'restart') restart();
    else if (act === 'next') goNext();
    else if (act === 'back') goBack();
    else if (act === 'medal') saveMedal(b);
    else if (act === 'retry') { setSend('sending'); flush(); }
    else if (act === 'big') { state.big = !state.big; render('same'); const t = app.querySelector('[data-act="big"]'); if (t) t.focus({ preventScroll: true }); announce(state.big ? 'Letra grande activada.' : 'Letra normal.'); }
    else if (act === 'copy') {
      const ok = () => { b.lastChild.textContent = 'Enlace copiado'; announce('Enlace copiado. Pégalo en WhatsApp o donde quieras.'); };
      const fail = () => {
        state.shareFallback = true; render('same');
        const ta = document.getElementById('share-text');
        if (ta) { ta.focus({ preventScroll: true }); ta.select(); ta.scrollIntoView({ block: 'center' }); }
        announce('No se pudo copiar solo. El texto quedó seleccionado para que lo copies.');
      };
      try { navigator.clipboard.writeText(inviteText()).then(ok, fail); } catch (err) { fail(); }
    }
  });
  app.addEventListener('input', (e) => {
    if (e.target.id === 'sname') { sh.name = e.target.value; refreshShare(); return; }
    if (e.target.id !== 'ta') return;
    const v = e.target.value; if (v.trim()) state.answers[state.current] = v; else delete state.answers[state.current];
    const c = document.getElementById('count'); if (c) c.textContent = v.length + ' de 600';
    const btn = app.querySelector('.dock [data-act="next"]');
    if (btn) {
      if (isAnswered(Q[state.current], v) || Q[state.current].optional) btn.removeAttribute('aria-disabled'); else btn.setAttribute('aria-disabled', 'true');
      btn.textContent = nextLabel(state.current);
    }
    save();
  });
  window.addEventListener('online', () => flush());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && state.view === 'q') sendProgress(null, false, true); });

  load();
  // Enlaces directos: #grupos (administradores), #compartir (cualquier persona), #quienes
  const ROUTES = { '#grupos': () => { sh.mode = 'grupo'; openPage('share'); }, '#compartir': () => { sh.mode = sh.mode || 'persona'; openPage('share'); }, '#quienes': () => openPage('about') };
  const routeHash = () => { const r = ROUTES[location.hash]; if (r) r(); };
  window.addEventListener('hashchange', routeHash);
  if (ROUTES[location.hash]) routeHash(); else render();
  flush(); // envía respuestas que quedaron pendientes en este teléfono
})();
</script>
</body>
