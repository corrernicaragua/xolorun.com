<style>
  /* Xolo Run · Ruta Común (manual de marca v1.0). La misma piel que xolorun.com/encuesta y la landing:
     arena de fondo, lago para el texto, jade secundario, arcilla solo para la acción principal y el único tramo encendido.
     Piezas reusadas: la pista de corredores, la franja de avance, las opciones, el aviso de tramo y la meta de la encuesta;
     los botones, el campo con etiqueta flotante, la casilla que dibuja su marca, el borde que barre y el confeti de la landing.
     Componentes adaptados de Uiverse.io (licencia MIT, https://opensource.org/license/mit, copyright de sus autores):
     botón con la flecha en un círculo: alexmaracinaru/perfect-panda-77 · borde que barre alrededor del botón final: vinodjangid07/pink-cheetah-68 ·
     campo con etiqueta flotante: risabbir/clever-panda-6 · casilla que dibuja su marca: PriyanshuGupta28/massive-ape-73 ·
     línea que conecta los puestos y el punto que viaja: Pradeepsaranbishnoi/big-swan-35 (aquí, el riel de escritorio). */
  :root {
    --arena: #F3EFE7; --blanco: #FFFFFF;
    --lago: #12383B;       /* texto principal: 11:1 sobre arena */
    --lago-400: #4D6A6C;   /* texto secundario y borde de controles: 5:1 sobre arena */
    --lago-300: #889C9D; --lago-100: #DBE1E2;
    --niebla: #B7C2BE; --niebla-300: #DBE0DE; --niebla-200: #E9EDEC;
    --jade: #1F6366; --jade-100: #DDE8E8; --jade-200: #BCD0D1;
    --arcilla: #C65A3D;    /* acción principal (texto blanco en negrita de 19 px) */
    --arcilla-600: #9E4831;/* arcilla para texto pequeño: 5.7:1 */
    --arcilla-300: #E8B3A4; --arcilla-100: #F6E6E2;
    --display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --voz: "Newsreader", Georgia, serif;
    --ease: cubic-bezier(.33, 1, .68, 1); --t1: 250ms; --t2: 500ms;
    --r: 14px;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; font-size: 100%; background: var(--arena); accent-color: var(--lago); scrollbar-color: var(--niebla) var(--arena); -webkit-text-size-adjust: 100%; }
  html.big { font-size: 125%; }
  body { margin: 0; min-height: 100%; padding-top: env(safe-area-inset-top, 0px); background: var(--arena); color: var(--lago); caret-color: var(--lago);
    font: 400 1.0625rem/1.5 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  ::selection { background: var(--lago); color: var(--arena); }
  button, input, textarea { font: inherit; color: inherit; }
  button, a, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--lago); outline-offset: 3px; }
  [tabindex="-1"]:focus { outline: none; }
  h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  a { color: var(--jade); text-underline-offset: 3px; }
  svg { display: block; }
  .sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: 16px; top: -80px; z-index: 50; padding: 10px 14px; background: var(--lago); color: var(--arena); border-radius: 10px; }
  .skip:focus { top: 12px; }
  .shell { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .main { min-width: 0; min-height: 100dvh; display: flex; flex-direction: column; }
  .wrap { width: 100%; max-width: 34rem; margin-inline: auto; padding-inline: 20px; }
  .stack { display: grid; gap: 12px; }

  /* ───────── Botones (landing): píldora arcilla con la flecha en un círculo y el texto que rueda ───────── */
  .go { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 56px; padding: 0 10px 0 24px; border: 0; border-radius: 999px;
    background: var(--arcilla); color: var(--blanco); font: 700 1.1875rem/1 var(--body); text-decoration: none; white-space: nowrap;
    box-shadow: 0 10px 24px -14px rgba(198, 90, 61, .9); transition: transform var(--t1) var(--ease), background-color var(--t1) var(--ease), box-shadow var(--t1) var(--ease), color var(--t1) var(--ease); }
  .go.block { display: flex; width: 100%; justify-content: space-between; }
  .go svg { flex: none; width: 36px; height: 36px; padding: 8px; border-radius: 50%; background: rgba(255, 255, 255, .16); transition: transform var(--t1) var(--ease), background var(--t1) var(--ease), color var(--t1) var(--ease); }
  .roll { display: inline-block; height: 1.15em; line-height: 1.15em; overflow: hidden; white-space: nowrap; vertical-align: middle; }
  .roll > span { display: block; transition: transform .35s var(--ease); }
  /* en pantallas táctiles el texto no rueda: puede ocupar dos líneas en vez de cortarse a 320 px */
  @media not all and (hover: hover) { .go { white-space: normal; text-align: left; line-height: 1.2; padding-block: 10px; } .roll { height: auto; white-space: normal; } .roll > span + span { display: none; } }
  @media (hover: hover) and (pointer: fine) {
    .go:not([aria-disabled="true"]):hover { background: var(--arcilla-600); transform: translateY(-1px); }
    .go:not([aria-disabled="true"]):hover svg { background: var(--blanco); color: var(--arcilla-600); transform: translateX(3px); }
  }
  @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) { .go:not([aria-disabled="true"]):hover .roll > span { transform: translateY(-100%); } }
  .go:active { transform: scale(.985); }
  .go[aria-disabled="true"] { background: var(--niebla-300); color: var(--lago-400); box-shadow: none; cursor: not-allowed; }
  .go[aria-disabled="true"] svg { background: rgba(18, 56, 59, .07); }
  /* mientras guarda (lista de espera): líneas de velocidad cruzan el botón y un borde barre alrededor */
  .go.busy { cursor: progress; }
  .go.busy::before { content: ""; position: absolute; left: 0; top: 30%; height: 2px; width: 30%; background: rgba(255, 255, 255, .45); animation: lf2 .7s linear infinite; }
  .go.busy::after { content: ""; position: absolute; left: 0; top: 64%; height: 2px; width: 22%; background: rgba(255, 255, 255, .35); animation: lf2 .9s linear infinite -.3s; }
  .go.busy svg { opacity: 0; }
  @keyframes lf2 { from { transform: translateX(340%); } to { transform: translateX(-120%); } }
  .sweep-w { position: relative; display: block; border-radius: 999px; }
  .sweep-w::before { content: ""; position: absolute; inset: -4px; border-radius: inherit; padding: 4px; background: conic-gradient(from var(--a, 0deg), transparent 0 68%, var(--arcilla) 86%, transparent 100%); opacity: 0; transition: opacity var(--t2) var(--ease);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .sweep-w.on::before { opacity: 1; animation: sweepA 1.6s linear infinite; }
  @keyframes sweepA { to { --a: 360deg; } }
  .ghost { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 20px; border: 1.5px solid var(--lago); border-radius: 999px; background: none; color: var(--lago);
    font: 600 1rem/1 var(--body); text-decoration: none; transition: background var(--t1) var(--ease), color var(--t1) var(--ease); }
  .ghost.block { width: 100%; }
  .ghost svg { width: 20px; height: 20px; }
  @media (hover: hover) and (pointer: fine) { .ghost:hover { background: var(--lago); color: var(--arena); } }
  .textlink { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--lago-400); font: 500 1rem/1.3 var(--body);
    text-align: left; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--niebla); border-radius: 6px; justify-self: start; }
  .textlink.c { justify-self: center; }
  @media (hover: hover) and (pointer: fine) { .textlink:hover { color: var(--lago); text-decoration-color: var(--lago); } }

  /* ───────── Encabezado ───────── */
  .topbar { display: flex; align-items: center; gap: 10px; min-height: 52px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; text-decoration: none; color: var(--lago); }
  .brand svg { height: 21px; width: auto; flex: none; }
  .brand span { font: 500 .75rem/1.1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--jade); white-space: nowrap; }
  .tool { flex: none; min-width: 48px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--lago-400); background: transparent; color: var(--lago);
    font: 600 1rem/1 var(--display); display: inline-grid; place-items: center; transition: background var(--t1) var(--ease), color var(--t1) var(--ease); }
  .tool[aria-pressed="true"] { background: var(--lago); color: var(--arena); border-color: var(--lago); }
  .tool svg { width: 22px; height: 22px; }
  @media (max-width: 440px) { .topbar.back .brand span { display: none; } }
  @media (max-width: 380px) { .brand span { display: none; } }

  /* ───────── Pantallas con pista de corredores (salida, aviso de bloque, meta) ───────── */
  .field { position: relative; flex: 1; display: flex; flex-direction: column; isolation: isolate; }
  .scene { position: absolute; left: 0; top: 0; width: 100%; height: 0; z-index: -1; display: block; pointer-events: none; }
  .field-inner { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-block: 8px 22px; }
  .eyebrow { font: 500 .75rem/1.25 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--arcilla-600); }
  .headline { font: 700 min(13vw, 76px)/1.02 var(--display); letter-spacing: -.035em; text-wrap: balance; }
  .headline em { font: italic 400 1.04em/1 var(--voz); letter-spacing: -.01em; color: var(--jade); }
  .headline.small { font-size: min(10.4vw, 56px); line-height: 1.05; }
  .lede { font-size: 1.125rem; line-height: 1.5; color: var(--lago-400); max-width: 38ch; }
  .lede b { color: var(--lago); font-weight: 600; }
  .track-space { flex: 1 0 clamp(110px, 22svh, 300px); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 20px; font-weight: 600; }
  .facts li { display: flex; align-items: center; gap: 8px; }
  .facts li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--jade); }
  /* la única línea que insinúa lo que hay al final: un sello apagado y una frase, sin decir qué es */
  .promise { display: flex; align-items: center; gap: 12px; color: var(--lago); font-weight: 600; max-width: 40ch; }
  .promise .seal { flex: none; width: 34px; height: 34px; }
  .local { padding: 10px 14px; border-radius: 12px; border: 1.5px dashed var(--arcilla-600); color: var(--arcilla-600); font-weight: 600; font-size: .95rem; }
  .actions { display: grid; gap: 4px; position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 2; }
  .foot { display: flex; flex-wrap: wrap; gap: 4px 16px; padding-bottom: 8px; }
  .enter { animation: settle .5s var(--ease) both; }
  @keyframes settle { from { opacity: .35; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ───────── Pregunta (encuesta): franja blanca con tu corredor, el sello al final y el tramo ───────── */
  .q { flex: 1; display: flex; flex-direction: column; }
  .band { position: relative; z-index: 4; background: var(--blanco); border-bottom: 1px solid var(--niebla-300); }
  .band-track { position: relative; height: 50px; overflow: visible; }
  .band-track canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .band-track .seal { position: absolute; right: 0; top: 20px; width: 34px; height: 34px; }
  .band-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 8px 12px; font-size: .95rem; color: var(--lago-400); }
  .band-cap b { color: var(--lago); font: 600 1rem/1.3 var(--display); }
  .band-cap span { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .qbody { display: grid; gap: 14px; padding-block: 26px 12px; }
  .q-title { font: 600 clamp(1.5rem, 6.2vw, 2rem)/1.2 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  .q-help { color: var(--lago-400); max-width: 44ch; }
  .opts { display: grid; gap: 10px; margin-top: 6px; }
  .opt { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 3.75rem; padding: 14px 16px; text-align: left; font-size: 1.0625rem; line-height: 1.3; font-weight: 500;
    background: var(--blanco); color: var(--lago); border: 1.5px solid var(--lago-300); border-radius: var(--r);
    transition: background-color var(--t1) var(--ease), border-color var(--t1) var(--ease), color var(--t1) var(--ease), transform var(--t1) var(--ease); }
  .opt:active { transform: scale(.99); }
  .opt .lbl { min-width: 0; flex: 1; }
  .opt .lbl small { display: block; margin-top: 3px; font-size: .92rem; font-weight: 400; color: var(--lago-400); }
  .opt .ind { flex: none; width: 24px; height: 24px; border: 2px solid var(--lago-400); display: grid; place-items: center; transition: inherit; }
  .opt[role="radio"] .ind { border-radius: 50%; }
  .opt[role="checkbox"] .ind { border-radius: 7px; }
  .opt .ind svg { width: 16px; height: 16px; color: var(--lago); }
  .opt .ind path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .32s var(--ease); }
  .opt[aria-checked="true"] { background: var(--lago); border-color: var(--lago); color: var(--arena); font-weight: 600; }
  .opt[aria-checked="true"] .ind { border-color: var(--arena); background: var(--arena); }
  .opt[aria-checked="true"] .ind path { stroke-dashoffset: 0; }
  .opt[role="radio"][aria-checked="true"] .ind { box-shadow: inset 0 0 0 5px var(--arena); background: var(--lago); }
  .opt[role="radio"] .ind svg { display: none; }
  .opt[aria-checked="true"] .lbl small { color: var(--arena); opacity: .8; }
  .opt[aria-disabled="true"] { opacity: .42; }
  .opt .key { flex: none; display: none; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 7px; border: 1px solid var(--niebla); color: var(--lago-400); font: 600 .8rem/24px var(--display); text-align: center; }
  .opt[aria-checked="true"] .key { border-color: rgba(243, 239, 231, .4); color: var(--arena); }
  @media (hover: hover) and (pointer: fine) {
    .opt .key { display: inline-block; }
    .opt:not([aria-checked="true"]):not([aria-disabled="true"]):hover, .chip:not([aria-checked="true"]):hover { border-color: var(--lago); }
  }
  .textarea { width: 100%; min-height: 9rem; padding: 14px 16px; border-radius: var(--r); border: 1.5px solid var(--lago-400); background: var(--blanco); color: var(--lago); font-size: 1.0625rem; line-height: 1.45; resize: vertical; }
  .textarea::placeholder { color: var(--lago-400); opacity: .85; }
  .textarea:focus { border-color: var(--lago); outline: none; box-shadow: 0 0 0 3px var(--lago-100); }
  .count { justify-self: end; font-size: 1rem; color: var(--lago-400); font-variant-numeric: tabular-nums; }
  .hint { color: var(--arcilla-600); min-height: 1.4em; font-weight: 600; }
  /* aviso de tramo (encuesta): uno por bloque, reconocimiento o curiosidad, nunca qué hay al final */
  .cheer { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--jade-100); border: 1px solid var(--jade-200); animation: cheerIn .5s var(--ease) both; }
  .cheer svg { flex: none; width: 26px; height: 26px; color: var(--jade); }
  .cheer b { color: var(--jade); }
  @keyframes cheerIn { from { opacity: .4; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .dock { position: sticky; bottom: 0; margin-top: auto; z-index: 3; padding-block: 18px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, rgba(243, 239, 231, 0), var(--arena) 28%); }
  /* con el teclado abierto (iPhone) la barra deja de flotar: queda debajo del campo y no lo tapa */
  html.kb .dock, html.kb .actions { position: static; }

  /* ───────── Campo con etiqueta flotante y casilla (lista de espera) ───────── */
  .neb { position: relative; display: flex; align-items: center; border-radius: 16px; background: var(--blanco); box-shadow: inset 0 0 0 1.5px var(--lago-300); transition: box-shadow var(--t1) var(--ease); }
  .neb:focus-within { box-shadow: inset 0 0 0 2px var(--lago); }
  .neb.bad { box-shadow: inset 0 0 0 2px var(--arcilla-600); }
  .neb input { flex: 1; width: 100%; min-width: 0; height: 64px; padding: 22px 18px 4px; border: 0; background: none; font: 500 1.125rem/1 var(--body); color: var(--lago); outline: 0; border-radius: 16px; }
  .neb label { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); max-width: calc(100% - 36px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1.0625rem; color: var(--lago-400); pointer-events: none;
    transition: transform var(--t1) var(--ease), font-size var(--t1) var(--ease), top var(--t1) var(--ease); }
  .neb input:focus ~ label, .neb input:not(:placeholder-shown) ~ label { top: 12px; transform: none; font-size: .75rem; color: var(--jade); font-weight: 600; letter-spacing: .04em; }
  .neb .pre { display: none; padding: 20px 0 2px 18px; font: 500 1.125rem/1 var(--body); color: var(--lago-400); }
  .neb.tel:not(.intl) .pre { display: block; }
  .neb.tel:not(.intl) input { padding-left: 6px; }
  .neb.tel:not(.intl) label { left: 66px; top: 22px; bottom: 4px; transform: none; display: flex; align-items: center; transition: font-size var(--t1) var(--ease), top var(--t1) var(--ease), left var(--t1) var(--ease); }
  .neb.tel:not(.intl) input:focus ~ label, .neb.tel:not(.intl) input:not(:placeholder-shown) ~ label { left: 18px; top: 12px; bottom: auto; display: block; }
  .err { color: var(--arcilla-600); font-weight: 600; font-size: .95rem; }
  .err:empty { display: none; }
  .note { font-size: .95rem; color: var(--lago-400); }
  .check { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; font-size: .97rem; line-height: 1.45; color: var(--lago-400); cursor: pointer; }
  .check .cb { position: relative; width: 26px; height: 26px; margin-top: 1px; }
  .check input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .check svg { width: 26px; height: 26px; fill: none; }
  .check .bg { fill: var(--blanco); stroke: var(--lago-400); stroke-width: 1.5; }
  .check .ring { stroke: var(--lago); stroke-width: 2.5; stroke-dasharray: 91; stroke-dashoffset: 91; transition: stroke-dashoffset var(--t2) var(--ease); }
  .check .tick { stroke: var(--lago); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset var(--t2) var(--ease) .1s; }
  .check input:checked ~ svg .ring, .check input:checked ~ svg .tick { stroke-dashoffset: 0; }
  .check input:focus-visible ~ svg { outline: 3px solid var(--lago); outline-offset: 2px; border-radius: 50%; }
  .check.bad .bg { stroke: var(--arcilla-600); stroke-width: 2; }
  .check a, .check .inl { color: var(--lago); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; font-size: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--lago-300); background: var(--blanco); color: var(--lago); font-weight: 500; font-size: .98rem;
    transition: background var(--t1) var(--ease), color var(--t1) var(--ease), border-color var(--t1) var(--ease); }
  .chip[aria-checked="true"] { background: var(--lago); border-color: var(--lago); color: var(--arena); font-weight: 600; }

  /* ───────── El sello: en silueta durante la ruta, se revela por bloques (contorno, anillo de texto, color) ───────── */

  const SEND_TEXT = {
    sending: ['Enviando tus respuestas…', ''],
    ok: DRY ? ['Vista previa: no se envió nada.', 'En el sitio publicado aquí se confirma que tus respuestas llegaron.'] : ['Tus respuestas llegaron.', 'Gracias por tomarte el tiempo.'],
    offline: ['Sin señal por ahora.', 'Quedaron guardadas en este teléfono y se envían solas cuando vuelva la conexión.'],
    error: ['No pudimos guardar tus respuestas.', 'Intentá de nuevo en un momento.']
  };
  function sendBox() {
    if (state.send === 'idle') return '';
    const t = SEND_TEXT[state.send];
    return '<div class="send" id="send" data-s="' + state.send + '" role="status"><span class="dot" aria-hidden="true"></span><div class="msg"><b>' + t[0] + '</b>' +
      (t[1] ? '<span class="muted">' + t[1] + '</span>' : '') + (state.send === 'offline' || state.send === 'error' ? '<button type="button" class="textlink" data-act="retry">Intentar de nuevo</button>' : '') + '</div></div>';
  }
  function setSend(which, s) {
    state[which] = s;
    if (which === 'send') {
      const el = $('#send'); if (el) el.outerHTML = sendBox();
      if (s === 'ok') announce(DRY ? 'Vista previa: no se envió nada.' : 'Tus respuestas llegaron.');
      return;
    }
    // contacto
    const b = $('#lead-go');
    if (s === 'ok' || s === 'offline') { if (state.view === 'contact') { state.view = 'sent'; render(); } return; }
    state.leadSent = false; save();
    if (b) { b.classList.remove('busy'); b.removeAttribute('aria-busy'); b.parentElement.classList.remove('on'); setRoll(b, 'Enviar'); }
    const e = $('#form-err'); if (e) e.textContent = 'No pudimos guardar tus datos. Revisá el número o el correo e intentá de nuevo.';
  }
  addEventListener('online', flush);

  // ───────── Corredores (pictogramas en canvas, los mismos de la encuesta) ─────────
  const TAU = Math.PI * 2;
  const NIEBLA = [219, 224, 222], LAGO = [18, 56, 59];
  const CLAY = '#C65A3D';   // arcilla: tu corredor y la línea de meta, el único tramo encendido
  const tintOf = (m) => 'rgb(' + NIEBLA.map((c, i) => Math.round(c + (LAGO[i] - c) * m)).join(',') + ')';
  const DISPLAY_FONT = '"Space Grotesk", system-ui, sans-serif';
  const POSE = {
    run:    { legAmp: 0.72, flexB: 0.15, flexA: 1.3,  armAmp: 0.75, elbow: 1.5,  lean: 0.18, bob: 0.035, head: 0.105 },
    kid:    { legAmp: 0.74, flexB: 0.15, flexA: 1.25, armAmp: 0.8,  elbow: 1.45, lean: 0.14, bob: 0.04,  head: 0.135 },
    senior: { legAmp: 0.3,  flexB: 0.05, flexA: 0.25, armAmp: 0.12, elbow: 0.2,  lean: 0.3,  bob: 0.006, head: 0.105 }
  };
  function drawRunner(ctx, x, ground, h, p, kind, color) {
    const cheer = kind === 'cheer', P = POSE[cheer ? 'run' : kind];
    const T = h * 0.28, TH = h * 0.25, SH = h * 0.25, UA = h * 0.17, FA = h * 0.15, HR = h * P.head;
    const lean = cheer ? 0.02 : P.lean;
    const bob = cheer ? 0 : kind === 'senior' ? h * P.bob * Math.cos(2 * p) : h * P.bob * Math.abs(Math.sin(p));
    const hx = x, hy = ground - (TH + SH) * 0.95 - bob;
    const sx = hx + Math.sin(lean) * T, sy = hy - Math.cos(lean) * T;
    const kx = sx + Math.sin(lean) * HR * 1.75, ky = sy - Math.cos(lean) * HR * 1.75;
    const lw = h * 0.14;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let hand = null;
    const limb = (ax, ay, a1, l1, a2, l2) => {
      const bx = ax + Math.sin(a1) * l1, by = ay + Math.cos(a1) * l1;
      const cx = bx + Math.sin(a2) * l2, cy = by + Math.cos(a2) * l2;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.stroke();
      return [cx, cy];
    };
    if (cheer) {
      limb(hx, hy, -0.13, TH, -0.1, SH); limb(hx, hy, 0.13, TH, 0.1, SH);
      limb(sx, sy, Math.PI + 0.5, UA, Math.PI + 0.42, FA); limb(sx, sy, Math.PI - 0.5, UA, Math.PI - 0.42, FA);
    } else {
      for (const ph of [p + Math.PI, p]) {
        const a = P.legAmp * Math.sin(ph), flex = P.flexB + P.flexA * Math.max(0, Math.cos(ph));
        limb(hx, hy, a, TH, a - flex, SH);
        if (kind === 'senior' && ph === p) hand = limb(sx, sy, 0.42, UA, 0.55, FA);
        else { const ua = -P.armAmp * Math.sin(ph); limb(sx, sy, ua, UA, ua + P.elbow, FA); }
      }
    }
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(sx, sy); ctx.stroke();
    ctx.beginPath(); ctx.arc(kx, ky, HR, 0, TAU); ctx.fill();
    if (hand) { ctx.lineWidth = lw * 0.5; ctx.beginPath(); ctx.moveTo(hand[0], hand[1]); ctx.lineTo(hand[0] + h * 0.05, ground); ctx.stroke(); }
  }
  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const LANES = [['run', 'senior'], ['kid', 'run'], ['run', 'kid'], ['senior', 'kid', 'run'], ['you', 'run']];
  const KIND = { run: { speed: 0.95, stride: 1.15, scale: 1 }, you: { speed: 1.0, stride: 1.15, scale: 1.05 }, kid: { speed: 0.8, stride: 1.0, scale: 0.64 }, senior: { speed: 0.3, stride: 0.6, scale: 0.97 } };
  const FRAME_MS = 33;

  class TrackScene {
    constructor(section, opts) {
      this.section = section; this.opts = opts || {};
      this.canvas = section.querySelector('canvas.scene'); this.ctx = this.canvas.getContext('2d');
      this.spacer = section.querySelector('.track-space');
      this.runners = null; this.lastDraw = 0; this.raf = 0; this.visible = true; this.pulse = 0;
      this.still = reduceMotion();
      this.ro = new ResizeObserver(() => { this.layout(); this.draw(); });
      this.ro.observe(section);
      this.io = new IntersectionObserver((es) => { this.visible = es[0].isIntersecting; if (this.visible) this.play(); else this.pause(); });
      this.io.observe(this.canvas);
      this.layout(); this.draw(); this.play();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.draw());
    }
    play() { if (!this.still && !this.raf) this.raf = requestAnimationFrame((t) => this.tick(t)); }
    pause() { cancelAnimationFrame(this.raf); this.raf = 0; this.lastDraw = 0; }
    layout() {
      const W = this.section.clientWidth, pad = 34;
      const top = this.spacer.offsetTop - pad, hgt = this.spacer.offsetHeight + pad + 6;
      const dpr = Math.min(1.5, window.devicePixelRatio || 1);
      const prevW = this.W;
      this.W = W; this.H = hgt;
      this.canvas.style.top = top + 'px'; this.canvas.style.height = hgt + 'px';
      this.canvas.width = Math.round(W * dpr); this.canvas.height = Math.round(hgt * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.gap = this.spacer.offsetHeight / LANES.length;
      this.base = LANES.map((_, i) => pad + this.gap * (i + 1) - 2);
      this.unit = Math.max(26, Math.min(this.gap * 1.3, 96));
      this.fx = Math.round(W * 0.72);
      if (!this.runners) this.seed();
      else if (prevW && prevW !== W) this.runners.forEach((m) => { m.x *= W / prevW; if (m.stopAt) m.stopAt = W * 0.86; });
    }
    seed() {
      const rand = rng(11);
      const reps = Math.max(1, Math.round(this.W / 440));
      this.runners = [];
      LANES.forEach((kinds, li) => {
        const depth = 0.7 + li * 0.08, list = [];
        for (let r = 0; r < reps; r++) kinds.forEach((k) => { if (k !== 'you' || r === 0) list.push(k); });
        list.forEach((k, j) => {
          const K = KIND[k], h = this.unit * depth * K.scale, v = K.speed * h * 0.95;
          const m = { lane: li, kind: k, h, x: (j + 0.15 + rand() * 0.55) * (this.W / list.length), p: rand() * TAU, v, cad: v / (K.stride * h) * TAU };
          if (k === 'you') {
            if (this.opts.finish) { m.x = this.still ? this.W * 0.86 : this.W * 0.38; m.stopAt = this.W * 0.86; m.done = this.still; m.vmax = Math.max(60, (this.fx - m.x) / 1.4); }
            else m.x = this.W * 0.3;
          }
          this.runners.push(m);
        });
      });
    }
    tick(t) {
      this.raf = 0;
      if (!this.visible) return;
      if (t - this.lastDraw >= FRAME_MS) {
        const dt = this.lastDraw ? Math.min(0.1, (t - this.lastDraw) / 1000) : 0;
        this.lastDraw = t;
        if (!document.hidden) { this.step(dt); this.draw(); }
      }
      this.raf = requestAnimationFrame((n) => this.tick(n));
    }
    step(dt) {
      if (this.pulse > 0) this.pulse = Math.max(0, this.pulse - dt);
      for (const m of this.runners) {
        if (m.stopAt) {
          if (m.done) continue;
          const left = m.stopAt - m.x, speed = Math.min(m.vmax, Math.max(10, left * 2.6)), before = m.x;
          m.x = Math.min(m.stopAt, m.x + speed * dt);
          m.p += (speed / (1.15 * m.h)) * TAU * dt;
          if (before < this.fx && m.x >= this.fx) { this.pulse = 0.6; if (this.opts.onCross) this.opts.onCross(this.canvas, this.fx, this.base[m.lane] - m.h * 0.6); }
          if (m.stopAt - m.x < 0.8) m.done = true;
          continue;
        }
        m.x += m.v * dt; m.p += m.cad * dt;
        if (m.x - m.h > this.W) m.x = -m.h * 1.2;
      }
    }
    draw() {
      const c = this.ctx, W = this.W, H = this.H;
      c.clearRect(0, 0, W, H);
      const size = Math.round(Math.max(18, this.gap * 0.62));
      c.font = '600 ' + size + 'px ' + DISPLAY_FONT;
      this.base.forEach((y, i) => {
        c.fillStyle = tintOf(0.12 + i * 0.03);
        c.fillText(String(LANES.length - i), 12, y - 5);
        c.strokeStyle = tintOf(0.1 + i * 0.03); c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(0, y + 0.5); c.lineTo(W, y + 0.5); c.stroke();
      });
      if (this.opts.finish) {
        const y0 = this.base[0] - this.gap * 0.95, y1 = this.base[this.base.length - 1] + 3;
        c.strokeStyle = CLAY; c.lineWidth = 3 + 6 * (this.pulse / 0.6);
        c.beginPath(); c.moveTo(this.fx, y0); c.lineTo(this.fx, y1); c.stroke();
        c.fillStyle = CLAY; c.font = '600 15px ' + DISPLAY_FONT;
        c.textAlign = 'center'; c.fillText('META', this.fx, y0 - 8); c.textAlign = 'start';
      }
      for (const m of this.runners) {
        const you = m.kind === 'you';
        drawRunner(c, m.x, this.base[m.lane], m.h, m.p, you ? (m.done ? 'cheer' : 'run') : m.kind, you ? CLAY : tintOf(0.22 + m.lane * 0.07));
      }
    }
    destroy() { this.pause(); this.ro.disconnect(); this.io.disconnect(); }
  }

  // Franja de avance: tu corredor en una línea con un punto por bloque; al final no hay poste de meta sino el sello en silueta
  class BandScene {
    constructor(holder, target, from, marks) {
      this.holder = holder; this.canvas = holder.querySelector('canvas'); this.ctx = this.canvas.getContext('2d');
      this.target = target; this.pos = reduceMotion() ? target : from; this.marks = marks; this.p = 0.9; this.last = 0; this.raf = 0;
      this.ro = new ResizeObserver(() => { this.layout(); this.draw(); });
      this.ro.observe(holder);
      this.layout(); this.draw();
      if (Math.abs(this.target - this.pos) > 0.002) this.raf = requestAnimationFrame((t) => this.tick(t));
    }
    layout() {
      const r = this.holder.getBoundingClientRect(), dpr = Math.min(1.5, window.devicePixelRatio || 1);
      this.W = r.width; this.H = r.height;
      this.canvas.width = Math.round(r.width * dpr); this.canvas.height = Math.round(r.height * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    tick(t) {
      const dt = this.last ? Math.min(0.05, (t - this.last) / 1000) : 0; this.last = t;
      this.pos += (this.target - this.pos) * (1 - Math.exp(-dt * 3.2));
      this.p += dt * 11;
      if (Math.abs(this.target - this.pos) <= 0.002) { this.pos = this.target; this.p = 0.9; this.raf = 0; this.draw(); return; }
      this.draw();
      this.raf = requestAnimationFrame((n) => this.tick(n));
    }
    draw() {
      const c = this.ctx, W = this.W, y = 37, x0 = 4, x1 = W - 38, span = x1 - x0;
      c.clearRect(0, 0, W, this.H);
      c.lineCap = 'round'; c.lineWidth = 3;
      c.strokeStyle = tintOf(0.12);
      c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
      const xr = x0 + span * this.pos;
      c.strokeStyle = tintOf(0.85);
      c.beginPath(); c.moveTo(x0, y); c.lineTo(Math.max(x0, xr), y); c.stroke();
      c.fillStyle = tintOf(0.45);
      this.marks.forEach((m) => { if (m > 0.01) { c.beginPath(); c.arc(x0 + span * m, y, 2.6, 0, TAU); c.fill(); } });
      drawRunner(c, Math.max(x0 + 8, Math.min(x1 - 12, xr)), y - 1.5, 30, this.p, 'run', CLAY);
    }
    destroy() { cancelAnimationFrame(this.raf); this.ro.disconnect(); }
  }

  // ───────── El sello de Organizador Fundador ─────────
  // Apagado y sin texto legible al inicio; con cada bloque terminado se ve un poco más: primero el contorno,
  // luego el anillo de texto que se va escribiendo y el símbolo, y en la meta el color arcilla.
  const SEAL_TXT = 'ORGANIZADOR FUNDADOR · XOLO RUN · ';
  let sealSeq = 0;
  function sealSVG(tone, label) {
    const id = 'sl' + (++sealSeq);
    return '<svg class="seal ' + tone + '" viewBox="0 0 120 120"' + (label ? ' role="img" aria-label="' + label + '"' : ' aria-hidden="true" focusable="false"') + '>' +
      '<defs><path id="' + id + 'p" d="M60 60m-41 0a41 41 0 1 1 82 0a41 41 0 1 1-82 0"/>' +
      '<mask id="' + id + 'm" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><circle class="s-wr" cx="60" cy="60" r="43" fill="none" stroke="#fff" stroke-width="18" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" transform="rotate(180 60 60)"/></mask></defs>' +
      '<circle class="s-gh" cx="60" cy="60" r="55"/>' +
      '<circle class="s-ct" cx="60" cy="60" r="55" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" transform="rotate(-90 60 60)"/>' +
      '<g mask="url(#' + id + 'm)"><text class="s-tx" textLength="250" lengthAdjust="spacing"><textPath href="#' + id + 'p"></textPath></text></g>' +
      '<circle class="s-dc" cx="60" cy="60" r="27"/>' +
      '<g class="s-sy" transform="translate(60 61) scale(.2) translate(-128 -128)"><path d="' + SYM_PATH + '" fill="none" stroke-width="22"/><circle cx="64.055" cy="181.954" r="11"/><circle cx="104.874" cy="169.445" r="11"/><path d="' + SEG_PATH + '" fill="none" stroke-width="22"/></g>' +
      '</svg>';
  }
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  function setSeal(svg, r, instant) {
    if (!svg) return;
    if (instant) svg.classList.add('still');
    const ct = svg.querySelector('.s-ct'), wr = svg.querySelector('.s-wr'), sy = svg.querySelector('.s-sy');
    ct.style.strokeDashoffset = String(1 - clamp01(r / 0.25));
    const t = clamp01((r - 0.2) / 0.5);
    wr.style.strokeDashoffset = String(1 - t);
    // el texto del anillo solo existe en la página cuando empieza a escribirse: antes no lo encuentra ni un buscador
    const tp = svg.querySelector('textPath'); if (tp) tp.textContent = t > 0 ? SEAL_TXT : '';
    sy.style.opacity = String(clamp01((r - 0.55) / 0.3));
    svg.classList.toggle('lit', r >= 1);
    if (instant) { svg.getBoundingClientRect(); svg.classList.remove('still'); }
  }
  // dibuja el sello donde iba y lo lleva hasta donde va ahora (la transición la hace el CSS)
  function moveSeal(svg, from, to, pulse) {
    setSeal(svg, from, true);
    if (from === to) return;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      setSeal(svg, to);
      if (pulse && !reduceMotion()) { svg.classList.remove('pulse'); svg.getBoundingClientRect(); svg.classList.add('pulse'); }
    }));
  }

  // ───────── Confeti de marca (el de la landing, sin GSAP) ─────────
  function burst(x, y, n) {
    if (reduceMotion() || !Element.prototype.animate) return;
    const box = $('#confeti'), cols = ['#12383B', '#1F6366', '#C65A3D', '#B7C2BE', '#1F6366', '#12383B'], q = rng(7);
    box.innerHTML = '';
    for (let i = 0; i < (n || 54); i++) {
      const el = document.createElement('i'), wv = 7 + q() * 7, hv = 12 + q() * 14;
      el.style.cssText = 'width:' + wv + 'px;height:' + hv + 'px;background:' + cols[i % cols.length];
      box.appendChild(el);
      const vx = (q() - .5) * 900, vy = -500 - q() * 700, r0 = q() * 180, r1 = r0 + (q() - .5) * 900;
      const tf = (fx, fy, fr) => 'translate(' + (x + vx * fx) + 'px,' + (y + fy) + 'px) rotate(' + (r0 + (r1 - r0) * fr) + 'deg)';
      el.animate([
        { transform: tf(0, 0, 0), opacity: 1 },
        { transform: tf(.42, vy * .55, .3), opacity: 1, offset: .31 },
        { transform: tf(.8, vy * .55 + 430, .78), opacity: 1, offset: .78 },
        { transform: tf(1, vy * .55 + 700, 1), opacity: 0 }
      ], { duration: 1600, easing: 'linear', fill: 'forwards' });
    }
    setTimeout(() => { box.innerHTML = ''; }, 1800);
  }

  // ───────── Avisos de tramo: uno por bloque, nunca en cada pregunta ─────────
  function cheerFor(b) {
    const blocks = pathBlocks(), j = blocks.indexOf(b);
    if (j <= 0) return null;
    if (j === blocks.length - 1) return ['Último tramo.', ''];
    if (j === 1) return ['Listo: tu perfil.', ''];
    if (j === 2) return ['Vas por la mitad.', 'Lo mejor está en la meta.'];
    return ['Listo: ' + BLOCKS[blocks[j - 1]][0].toLowerCase() + '.', ''];
  }
  function cheerBox() {
    if (!state.cheer) return '';
    return '<div class="cheer">' + RUNNER + '<p><b>' + esc(state.cheer[0]) + '</b>' + (state.cheer[1] ? ' ' + esc(state.cheer[1]) : '') + '</p></div>';
  }

  // ───────── Pantallas ─────────
  const roll = (t) => '<span class="roll"><span>' + esc(t) + '</span><span aria-hidden="true">' + esc(t) + '</span></span>';
  const setRoll = (btn, t) => { const r = btn && btn.querySelector('.roll'); if (r) r.innerHTML = '<span>' + esc(t) + '</span><span aria-hidden="true">' + esc(t) + '</span>'; };
  const goBtn = (t, act, extra) => '<button type="button" class="go block" data-act="' + act + '"' + (extra || '') + '>' + roll(t) + ARROW + '</button>';
  function topbar(withBack) {
    return '<div class="topbar wrap' + (withBack ? ' back' : '') + '">' +
      (withBack ? '<button type="button" class="tool" data-act="back" aria-label="Volver">' + ic('back', 2.4) + '</button>' : '') +
      '<a class="brand" href="./">' + LOGO('#12383B') + '<span>Organizadores</span></a>' +
      '<button type="button" class="tool" data-act="big" aria-pressed="' + state.big + '" aria-label="Letra grande">Aa</button></div>';
  }

  function viewWelcome() {
    const resume = hasDraft();
    return '<section class="field enter" data-scene="track"><canvas class="scene" aria-hidden="true"></canvas><div class="field-inner">' + topbar(false) +
      '<div class="wrap stack">' + (DRY ? '<p class="local">Vista previa: esta página no envía respuestas.</p>' : '') +
        '<p class="eyebrow">Encuesta para organizadores de carreras de running</p>' +
        '<h1 class="headline" tabindex="-1" id="qt">Contanos cómo <em>organizás.</em></h1>' +
        '<p class="lede">Estamos creando <b>Xolo Run</b>, una app donde los corredores tendrán su perfil y los organizadores el suyo, para publicar sus carreras e inscribir a su gente. Antes de construir la parte de organizadores, queremos entender cómo lo hacés hoy.</p>' +
        '<p class="promise">' + sealSVG('light') + '<span>Al final de la ruta hay algo pensado para quienes organizan.</span></p></div>' +
      '<div class="track-space" aria-hidden="true"></div>' +
      '<div class="wrap stack"><ul class="facts"><li>Unos 10 minutos</li><li>Anónima</li><li>Se guarda sola</li></ul>' +
        (resume ? '<p class="muted">Tenés una encuesta a medias en este teléfono.</p>' : '') + '</div>' +
      '<div class="wrap actions">' + (resume ? goBtn('Seguir donde quedaste', 'resume') + '<button type="button" class="textlink c" data-act="restart">Empezar de nuevo</button>' : goBtn('Empezar', 'start')) + '</div>' +
      '<div class="wrap foot"><button type="button" class="textlink" data-act="privacy">Cómo cuidamos tus datos</button></div>' +
      '</div></section>';
  }

  function viewInfo(id) {
    const q = Q[id];
    return '<section class="field enter" data-scene="track"><canvas class="scene" aria-hidden="true"></canvas><div class="field-inner">' + topbar(true) +
      '<div class="wrap stack">' + cheerBox() + '<p class="eyebrow">' + esc(BLOCKS[q.b][0]) + '</p><h1 class="headline small" tabindex="-1" id="qt">' + esc(q.title) + '</h1><p class="lede">' + esc(q.help) + '</p></div>' +
      '<div class="track-space" aria-hidden="true"></div>' +
      '<div class="wrap actions">' + goBtn(q.cta || 'Seguir', 'next') + '</div></div></section>';
  }

  function optionsHTML(q, a) {

  let railSig = '', railP = 0, railR = 0;

  // ───────── Render ─────────
  let scenes = [], lastBand = 0, prevView = null, navLock = false, crossed = false;
  const main = $('#main');
  function render(dir) {
    const old = $('#qbody');
    if ((dir === 'fwd' || dir === 'back') && old && prevView === 'q' && state.view === 'q' && !reduceMotion() && old.animate) {
      // la salida nunca depende solo de que termine la animación: con la pestaña oculta onfinish puede no llegar
      navLock = true;
      let gone = false;
      const go = () => { if (gone) return; gone = true; paint(dir); };
      try { const an = old.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(' + (dir === 'back' ? 12 : -12) + 'px)' }], { duration: 140, easing: 'cubic-bezier(.55,0,.75,.2)', fill: 'forwards' }); an.onfinish = go; } catch (e) {}
      setTimeout(go, 180);
      return;

  function paint(dir) {
    navLock = false; onCrossHook = null; revealPlace = null;

    const V = { welcome: viewWelcome, done: viewDone, contact: viewContact, sent: viewSent, share: viewShare, privacy: viewPrivacy };
    main.innerHTML = state.view === 'q' ? (Q[state.current].type === 'info' ? viewInfo(state.current) : viewQuestion(state.current)) : V[state.view]();
    if (dir === 'same') $$('.enter', main).forEach((el) => el.classList.remove('enter'));
    crossed = false;
    $$('[data-scene]', main).forEach((sec) => scenes.push(new TrackScene(sec, { finish: sec.dataset.scene === 'finish', onCross: onCross })));
    const band = $('.band-track', main);
    if (band) {
      const { p, path } = progress();
      const marks = []; let prevB = null;
      path.forEach((id, k) => { if (Q[id].b !== prevB) { marks.push(k / path.length); prevB = Q[id].b; } });
      scenes.push(new BandScene(band, p, dir === 'same' ? p : lastBand, marks));
      lastBand = p;
      const target = sealTarget();
      moveSeal($('.seal', band), state.sealShown, target, target > state.sealShown);
      state.sealShown = target;
    } else if (state.view === 'welcome') lastBand = 0;

  // ───────── La meta: el corredor cruza, confeti, y el sello se completa, gira y abre la tarjeta ─────────
  let onCrossHook = null, revealPlace = null;
  addEventListener('resize', () => { if (revealPlace) revealPlace(); }, { passive: true });
  function onCross(canvas, x, y) {
    crossed = true;
    const r = canvas.getBoundingClientRect();
    burst(r.left + x, r.top + y);
    if (onCrossHook) onCrossHook();
  }
  function startReveal() {
    const card = $('#founder'); if (!card) return;
    const seal = $('.seal', card);
    if (state.revealed || reduceMotion()) { setSeal(seal, 1, true); card.classList.remove('closed'); card.classList.add('open'); state.revealed = true; save(); return; }
    setSeal(seal, Math.min(state.sealShown, 0.99), true);
    const place = () => {
      const c = card.getBoundingClientRect(), s = $('.fs', card).getBoundingClientRect(), full = card.scrollHeight;
      const cx = s.left - c.left + s.width / 2, cy = s.top - c.top + s.height / 2;
      card.style.setProperty('--h', full + 'px');
      card.style.setProperty('--cx', cx + 'px'); card.style.setProperty('--cy', cy + 'px');
      card.style.setProperty('--r0', (s.width / 2 + 8) + 'px');
      card.style.setProperty('--r1', Math.ceil(Math.hypot(Math.max(cx, c.width - cx), Math.max(cy, full - cy))) + 2 + 'px');
    };
    place();
    let seen = false, started = false;
    const timers = [];
    const later = (fn, ms) => timers.push(setTimeout(fn, ms));
    const run = () => {
      if (started || !seen || !(crossed || run.late)) return;
      if (state.view !== 'done' || !document.body.contains(card)) return;
      started = true;
      setSeal(seal, 1);
      later(() => { seal.classList.add('spin'); }, 900);
      later(() => { place(); card.classList.add('opening'); }, 1900);
      later(() => { card.classList.remove('closed', 'opening'); card.classList.add('open'); state.revealed = true; save(); announce('Se abrió la tarjeta de Organizadores Fundadores.'); }, 2900);
    };
    onCrossHook = () => later(run, 250);
    later(() => { run.late = true; run(); }, 2600);    // si la pestaña estaba oculta y el corredor no cruzó, igual se abre
    // se mide el contenedor, no la tarjeta: recortada al sello, la tarjeta casi no ocupa lugar en la pantalla
    const box = $('#founder-w');
    const look = () => { if (seen) return; const b = box.getBoundingClientRect(); if (b.top < innerHeight * 0.72 && b.bottom > 80) { seen = true; removeEventListener('scroll', look); later(run, 150); } };
    addEventListener('scroll', look, { passive: true });
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(() => { look(); if (seen) io.disconnect(); }, { threshold: [0, 0.2, 0.4, 0.6] });
      io.observe(box);
    }
    look(); later(look, 600);
    revealPlace = place;
  }

  // ───────── Acciones ─────────
  function start() {
    if (state.finished) { restart(); return; }
    if (!state.clientId) state.clientId = uuid();
    hit(hasDraft() ? 'encuesta_reanudada' : 'encuesta_inicio');
    if (!hasDraft()) { state.current = 'O1'; state.milestones = []; state.sealShown = 0; }
    state.view = 'q'; state.cheer = null; render();
  }
  function restart() {
    Object.assign(state, { current: 'O1', answers: {}, history: [], clientId: uuid(), finished: false, after: 'done', revealed: false, leadSent: false, lead: null, send: 'idle', leadSend: 'idle',
      milestones: [], cheer: null, sealShown: 0, hint: '', form: freshForm() });
    lastBand = 0; hit('encuesta_inicio'); state.view = 'q'; render();
  }
  function goNext() {
    if (state.view !== 'q' || navLock) return;
    clearTimeout(autoT);
    const id = state.current, q = Q[id], a = state.answers[id];
    if (q.optional && !isAnswered(q, a)) delete state.answers[id];   // saltada: no se guarda nada
    else if (q.type !== 'info' && !isAnswered(q, a)) {
      state.hint = q.type === 'multi' ? 'Elegí al menos una opción para seguir.' : (q.type === 'text' || q.type === 'short') ? 'Escribí al menos una palabra para seguir.' : 'Elegí una opción para seguir.';
      const h = $('#hint'); if (h) h.textContent = state.hint;
      announce(state.hint); return;
    }
    const nx = nextOf(id, state.answers[id]);
    state.hint = '';
    if (state.history[state.history.length - 1] !== id) state.history.push(id);
    if (nx === 'END') { finish(); return; }
    state.cheer = null;
    if (Q[nx].b !== q.b && !state.milestones.includes(Q[nx].b)) {
      state.milestones.push(Q[nx].b);
      state.cheer = cheerFor(Q[nx].b);
      if (state.cheer) setTimeout(() => announce(state.cheer ? state.cheer.join(' ') : ''), 450);
    }
    // quien la llena hablando con el equipo (?c=reunion) ya trae marcada la respuesta, y puede cambiarla
    if (nx === 'Z2' && CHANNEL === 'reunion' && state.answers.Z2 == null) state.answers.Z2 = 'reunion';
    state.current = nx;
    render('fwd');
  }
  function goBack() {
    clearTimeout(autoT);
    if (navLock) return;
    state.hint = '';
    if (state.view === 'privacy') { state.view = state.back || 'welcome'; render(); return; }
    if (state.view === 'contact') { state.lead = Object.assign({}, state.lead, readForm()); state.view = state.finished ? state.after : 'welcome'; render(); return; }
    if (state.view === 'q') {
      state.cheer = null;
      if (state.history.length) { state.current = state.history.pop(); render('back'); }
      else { state.view = 'welcome'; render(); }
      return;
    }
    state.view = 'welcome'; render();
  }
  function finish() {
    state.finished = true; state.after = 'done'; state.view = 'done'; state.cheer = null; state.send = 'sending';
    hit('encuesta_fin', true);
    enqueue('resp', responseBody());
    render(); announce('Llegaste a la meta.');
  }
  let autoT = 0;
  function pick(v) {
    const id = state.current, q = Q[id];
    clearTimeout(autoT);
    if (q.type === 'single') {
      state.answers[id] = v; state.hint = '';
      paintOpts();
      // una sola opción: avanza sola tras un respiro, para que se vea la selección
      autoT = setTimeout(goNext, reduceMotion() ? 140 : 360);
    } else {
      const op = q.options.find((x) => x.v === v);
      let cur = Array.isArray(state.answers[id]) ? state.answers[id].slice() : [];
      if (cur.includes(v)) cur = cur.filter((x) => x !== v);
      else if (op.ex) cur = [v];
      else {
        cur = cur.filter((x) => !(q.options.find((y) => y.v === x) || {}).ex);
        if (q.max && cur.length >= q.max) { state.hint = 'Podés elegir hasta ' + q.max + '. Quitá una para cambiarla.'; paintOpts(); announce(state.hint); return; }
        cur.push(v);
      }
      state.hint = '';
      if (cur.length) state.answers[id] = cur; else delete state.answers[id];
      paintOpts();
    }
    save();
  }
  // actualiza las opciones en su lugar (sin volver a pintar la pantalla): la marca se dibuja y nada salta
  function paintOpts() {
    const q = Q[state.current], a = state.answers[state.current];
    const full = q.type === 'multi' && q.max && Array.isArray(a) && a.length >= q.max;
    $$('.opts .opt', main).forEach((b) => {
      const on = q.type === 'multi' ? Array.isArray(a) && a.includes(b.dataset.v) : a === b.dataset.v;
      const op = q.options.find((x) => x.v === b.dataset.v) || {};
      b.setAttribute('aria-checked', on);
      if (full && !on && !op.ex) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
      if (q.type === 'single') b.tabIndex = on ? 0 : -1;
    });
    const h = $('#hint'); if (h) h.textContent = state.hint;
    const nx = $('#next');
    if (nx) { if (isAnswered(q, a) || q.optional) nx.removeAttribute('aria-disabled'); else nx.setAttribute('aria-disabled', 'true'); setRoll(nx, nextLabel(state.current)); }
  }

  // ───────── Formulario de contacto ─────────
  const cleanName = (v) => String(v || '').replace(/[­​-‏⁠-⁤﻿]/g, '').trim().replace(/\s+/g, ' ');
  const nameOk = (v) => v.length >= 2 && /[\p{L}\p{N}]/u.test(v);
  function normPhone(v) {
    let d = String(v || '').replace(/[^\d+]/g, '');
    if (d.startsWith('00')) d = '+' + d.slice(2);
    if (d.startsWith('+')) {
      const g = d.slice(1).replace(/\D/g, '');
      if (g.startsWith('505')) return /^505[2578]\d{7}$/.test(g) ? '+' + g : null;     // Nicaragua: +505 y 8 dígitos
      return g.length >= 10 && g.length <= 15 && g[0] !== '0' ? '+' + g : null;          // otros países: código y número
    }
    d = d.replace(/\D/g, '');
    if (/^[2578]\d{7}$/.test(d)) return '+505' + d;
    if (/^505[2578]\d{7}$/.test(d)) return '+' + d;
    return null;
  }
  const normEmail = (v) => { v = String(v || '').trim().toLowerCase(); return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(v) && v.length <= 254 ? v : null; };
  const val = (id) => ($('#f-' + id) || {}).value || '';
  const readForm = () => ({ name: val('name'), org: val('org'), contact: val('contact'), next: val('next'), mail: !!state.form.mail, ok: !!($('#f-ok') || {}).checked });
  function setErr(id, msg) {
    const e = $('#e-' + id); if (e) e.textContent = msg || '';
    const nb = $('#nb-' + id); if (nb) nb.classList.toggle('bad', !!msg);
    const inp = $('#f-' + id); if (inp) { if (msg) { inp.setAttribute('aria-invalid', 'true'); inp.setAttribute('aria-describedby', 'e-' + id + (id === 'contact' ? ' h-contact' : '')); } else inp.removeAttribute('aria-invalid'); }
  }
  function validate(L) {
    const errs = [];
    if (!state.form.interests.length) { $('#e-int').textContent = 'Elegí al menos una opción.'; errs.push(['int', 'Qué te interesa', $('[data-int]')]); } else $('#e-int').textContent = '';
    if (!nameOk(cleanName(L.name))) { setErr('name', 'Escribí tu nombre.'); errs.push(['name', 'Tu nombre', $('#f-name')]); } else setErr('name', '');
    const c = L.contact.trim();
    let cm = '';
    if (!c) cm = L.mail ? 'Escribí tu correo para escribirte.' : 'Escribí tu WhatsApp para escribirte.';
    else if (L.mail ? !normEmail(c) : !normPhone(c)) cm = L.mail ? 'Revisá el correo: falta algo, como la @ o el dominio.' : 'Revisá el número: son 8 dígitos, como 8888 8888. Si no es de Nicaragua, empieza con + y el código del país.';
    setErr('contact', cm); if (cm) errs.push(['contact', L.mail ? 'Tu correo' : 'Tu WhatsApp', $('#f-contact')]);
    $('#ck-ok').classList.toggle('bad', !L.ok);
    $('#e-ok').textContent = L.ok ? '' : 'Necesitamos tu permiso para guardar tus datos.'; if (!L.ok) errs.push(['ok', 'Permiso para guardar tus datos', $('#f-ok')]);
    const sum = $('#err-sum');
    if (errs.length > 1) { sum.hidden = false; sum.textContent = 'Revisá ' + errs.length + ' cosas: ' + errs.map((x) => x[1]).join(', ') + '.'; sum.focus(); }
    else { sum.hidden = true; if (errs.length && errs[0][2]) errs[0][2].focus(); }
    return !errs.length;
  }
  function submitLead(ev) {
    ev.preventDefault();
    const b = $('#lead-go');
    if (b.classList.contains('busy')) return;
    const L = readForm();
    if (!validate(L)) return;
    state.lead = L; state.leadSent = true; save();
    b.classList.add('busy'); b.setAttribute('aria-busy', 'true'); b.parentElement.classList.add('on'); setRoll(b, 'Enviando…');
    $('#form-err').textContent = '';
    state.leadSend = 'sending';
    hit('contacto');
    const f = state.form, talk = f.interests.includes('fundador') || f.interests.includes('llamada'), c = L.contact.trim();
    enqueue('lead', { p_client_id: state.clientId, p_name: cleanName(L.name).slice(0, 80), p_organization: L.org.trim().slice(0, 100) || null,
      p_whatsapp: L.mail ? null : normPhone(c), p_email: L.mail ? normEmail(c) : null,
      p_interests: f.interests, p_meet: talk ? f.meet : null, p_slot: talk ? f.slot : null, p_next_event: talk ? (L.next.trim().slice(0, 80) || null) : null,
      p_consent_version: CONSENT_VERSION, p_channel: CHANNEL, p_ref: REF });
  }

  // ───────── Eventos ─────────
  document.addEventListener('click', (e) => {
    const opt = e.target.closest('.qbody .opts .opt');
    if (opt) {
      if (opt.getAttribute('aria-disabled') === 'true') { state.hint = 'Podés elegir hasta ' + Q[state.current].max + '. Quitá una para cambiarla.'; paintOpts(); announce(state.hint); }
      else pick(opt.dataset.v);
      return;
    }
    const it = e.target.closest('[data-int]');
    if (it) {
      const v = it.dataset.int, arr = state.form.interests;
      state.form.interests = arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat([v]);
      it.setAttribute('aria-checked', state.form.interests.includes(v));
      $('#e-int').textContent = '';
      const talk = $('#talk'), want = state.form.interests.includes('fundador') || state.form.interests.includes('llamada');
      if (want && talk.hidden) { talk.hidden = false; talk.classList.add('in'); } else if (!want) talk.hidden = true;
      save(); return;
    }
    const ch = e.target.closest('[data-meet],[data-slot]');
    if (ch) {
      const grp = ch.dataset.meet ? 'meet' : 'slot';
      state.form[grp] = ch.dataset[grp];
      $$('[data-' + grp + ']').forEach((x) => x.setAttribute('aria-checked', x === ch));
      save(); return;
    }
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'start' || act === 'resume') start();
    else if (act === 'restart') restart();
    else if (act === 'another') { restart(); state.view = 'welcome'; render(); }
    else if (act === 'next') goNext();   // deshabilitado igual explica qué falta
    else if (act === 'back') goBack();
    else if (act === 'big') { state.big = !state.big; btn.setAttribute('aria-pressed', state.big); document.documentElement.classList.toggle('big', state.big); announce(state.big ? 'Letra grande activada.' : 'Letra normal.'); save(); }
    else if (act === 'contact') { if (state.view === 'share') state.after = 'share'; state.view = 'contact'; render(); }
    else if (act === 'share') { state.after = 'share'; state.view = 'share'; render(); }
    else if (act === 'privacy') { e.preventDefault(); if (state.view === 'contact') state.lead = Object.assign({}, state.lead, readForm()); state.back = state.view === 'privacy' ? state.back : state.view; state.view = 'privacy'; render(); }
    else if (act === 'retry') { setSend('send', 'sending'); flush(); }
    else if (act === 'swap') {
      state.form.mail = !state.form.mail; state.lead = Object.assign({}, state.lead, readForm(), { contact: '' });
      const y = scrollY; render('same'); window.scrollTo(0, y); const f = $('#f-contact'); if (f) f.focus();
    }
    else if (act === 'wa') hit('compartir_whatsapp');
    else if (act === 'copy') {
      const url = btn.dataset.url, span = btn.querySelector('span');
      const ok = () => { span.textContent = 'Enlace copiado'; announce('Enlace copiado'); setTimeout(() => { span.textContent = 'Copiar el enlace'; }, 2000); };
      try { navigator.clipboard.writeText(url).then(ok, () => prompt('Copiá el enlace:', url)); } catch (err) { prompt('Copiá el enlace:', url); }
      hit('copiar_enlace');
    }
  });
  document.addEventListener('submit', (e) => { if (e.target.id === 'lead') submitLead(e); });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'ta' && state.view === 'q') {
      const q = Q[state.current], v = t.value;
      if (v.trim()) state.answers[state.current] = v; else delete state.answers[state.current];
      const c = $('#count'); if (c) c.textContent = v.length + ' de 600';
      const nx = $('#next');
      if (nx) { if (isAnswered(q, v) || q.optional) nx.removeAttribute('aria-disabled'); else nx.setAttribute('aria-disabled', 'true'); setRoll(nx, nextLabel(state.current)); }
      if (state.hint) { state.hint = ''; const h = $('#hint'); if (h) h.textContent = ''; }
      save(); return;
    }
    if (t.id === 'f-contact' && !state.form.mail) $('#nb-contact').classList.toggle('intl', /^\s*(\+|00)/.test(t.value));
    if (/^f-(name|org|contact|next)$/.test(t.id)) { if ($('#nb-' + t.id.slice(2)).classList.contains('bad')) setErr(t.id.slice(2), ''); state.lead = Object.assign({}, state.lead, readForm()); save(); }
    if (t.id === 'f-ok') { $('#ck-ok').classList.remove('bad'); $('#e-ok').textContent = ''; }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'f-ok') { $('#ck-ok').classList.remove('bad'); $('#e-ok').textContent = ''; state.lead = Object.assign({}, state.lead, readForm()); save(); } });
  document.addEventListener('keydown', (e) => {
    if (state.view !== 'q' || e.altKey || e.ctrlKey || e.metaKey) return;
    const q = Q[state.current], tag = e.target.tagName;
    if (tag === 'TEXTAREA') return;
    if (tag === 'INPUT') { if (e.key === 'Enter') { e.preventDefault(); goNext(); } return; }
    // con teclado físico: números 1–9 eligen, Enter sigue, flechas se mueven entre opciones de una sola respuesta
    if (/^[1-9]$/.test(e.key) && q.options && finePointer()) { const op = q.options[+e.key - 1]; if (op) { e.preventDefault(); const b = $('.opts .opt[data-v="' + op.v + '"]'); if (b && b.getAttribute('aria-disabled') !== 'true') pick(op.v); } return; }
    if (e.key === 'Enter' && !e.target.closest('button, a')) { e.preventDefault(); goNext(); return; }
    if (q.type === 'single' && /^Arrow(Up|Down|Left|Right)$/.test(e.key) && e.target.closest('.opt')) {
      e.preventDefault();
      const all = $$('.opts .opt'), k = all.indexOf(e.target.closest('.opt'));
      all[(k + (/Up|Left/.test(e.key) ? -1 : 1) + all.length) % all.length].focus();
    }
  });
  // iPhone: con el teclado abierto la barra de abajo no flota sobre el campo, y el campo queda a la vista
  const isField = (el) => !!el && /^(INPUT|TEXTAREA)$/.test(el.tagName) && el.type !== 'checkbox';
  function keyboardCheck() {
    const vv = window.visualViewport, el = document.activeElement;
    const open = isField(el) && (!vv || innerHeight - vv.height > 120 || matchMedia('(pointer: coarse)').matches);
    document.documentElement.classList.toggle('kb', open);
    if (open && vv && innerHeight - vv.height > 120) setTimeout(() => { if (document.activeElement === el) el.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); }, 80);
  }
  if (window.visualViewport) visualViewport.addEventListener('resize', keyboardCheck);
  document.addEventListener('focusin', (e) => { if (isField(e.target)) keyboardCheck(); });
  document.addEventListener('focusout', () => setTimeout(keyboardCheck, 120));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

  // ───────── Arranque ─────────
  load();
  hit('visita', true);
  try { const d = new Date(), today = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); if (localStorage.getItem('xr-o-dia') !== today) { localStorage.setItem('xr-o-dia', today); hit('visita_dia'); } } catch (e) {}
  if (state.finished) { state.view = state.leadSent ? 'sent' : state.after; state.sealShown = 1; }
  if (state.finished && state.leadSent && !readQueue().some((i) => i.kind === 'lead')) state.leadSend = 'ok';
  else if (state.finished && state.leadSent) state.leadSend = 'offline';
  if (TEST) window.__org = { state, Q, walk, pathBlocks, render, go: (id) => { state.view = 'q'; state.current = id; render(); }, finish };
  render();
  flush();
})();
</script>
</body>
