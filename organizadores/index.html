<meta property="og:description" content="Encuesta anónima de Xolo Run para quienes organizan carreras de running en Nicaragua. Unos 10 minutos.">
<meta property="og:url" content="https://xolorun.com/organizadores/">

<style>
  /* Xolo Run · Ruta Común (manual de marca v1.0): fondo arena, texto lago profundo, arcilla solo para la acción principal.
     Una columna de teléfono. La pista de corredores vive en la salida, los relevos y la meta; tu corredor es el único tramo en arcilla. */
  :root {
    --arena: #F3EFE7;      /* fondo */
    --blanco: #FFFFFF;     /* superficies: opciones, tarjetas, franja de progreso */
    --lago: #12383B;       /* texto principal: 11:1 sobre arena */
    --lago-400: #4D6A6C;   /* texto secundario y borde de controles: 5:1 sobre arena */
    --lago-300: #889C9D;
    --lago-100: #DBE1E2;
    --niebla: #B7C2BE;     /* solo bordes y divisores decorativos */
    --niebla-300: #DBE0DE;
    --niebla-200: #E9EDEC;
    --jade: #1F6366;       /* acento secundario: 6:1 sobre arena */
    --jade-100: #DDE8E8;
    --jade-200: #BCD0D1;
    --arcilla: #C65A3D;    /* acción principal (texto blanco en negrita de 19 px) y tu corredor */
    --arcilla-600: #9E4831;/* arcilla para texto pequeño: 5.7:1 */
    --display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --voz: "Newsreader", Georgia, serif;
    --ease: cubic-bezier(.33, 1, .68, 1);
    --r: 14px;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; font-size: 100%; background: var(--arena); accent-color: var(--lago); scrollbar-color: var(--niebla) var(--arena); }
  html.big { font-size: 125%; }
  body {
    margin: 0; min-height: 100%; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    background: var(--arena); color: var(--lago); caret-color: var(--lago);
    font: 400 1.0625rem/1.5 var(--body); -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--lago); color: var(--arena); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--lago); outline-offset: 3px; }
  h1[tabindex="-1"]:focus { outline: none; }
  h1, h2, h3, p, ul, ol { margin: 0; }
  ul { padding: 0; list-style: none; }
  a { color: var(--jade); text-underline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #app { flex: 1; display: flex; flex-direction: column; }
  .wrap { width: 100%; max-width: 34rem; margin-inline: auto; padding-inline: 20px; }
  .stack { display: grid; gap: 12px; }

  /* ───────── Pantallas con pista (salida, relevos, meta) ───────── */
  .field { position: relative; flex: 1; display: flex; flex-direction: column; isolation: isolate; }
  .scene { position: absolute; left: 0; top: 0; width: 100%; height: 0; z-index: -1; display: block; pointer-events: none; }
  .field-inner { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-block: 14px 22px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
  .wordmark { font: 600 .8125rem/1.1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--lago); }
  .wordmark b { color: var(--jade); font-weight: 600; }
  /* Autoría siempre visible, también en capturas de pantalla que circulen sin contexto */
  .brand { display: grid; gap: 4px; min-width: 0; }
  .byline { font: 500 .8125rem/1.1 var(--body); color: var(--lago-400); }
  .byline b { color: var(--lago); font-weight: 600; }
  .who { display: grid; gap: 8px; padding: 16px 18px; border-radius: var(--r); background: var(--blanco); border: 1px solid var(--niebla-300); }
  .who h2 { font: 600 1.1rem/1.25 var(--display); }
  .who h2 b { color: var(--jade); font-weight: 600; }
  .who p { color: var(--lago-400); max-width: 46ch; }
  .who .link { padding: 4px 0; text-align: left; }
  .local { padding: 10px 14px; border-radius: 12px; border: 1.5px dashed var(--arcilla-600); color: var(--arcilla-600); font-weight: 600; font-size: .95rem; }
  .page { display: grid; gap: 28px; padding-block: 18px 44px; }
  .page section { display: grid; gap: 10px; }
  .page h1 { font: 700 2.1rem/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  .page h2 { font: 600 1.25rem/1.25 var(--display); }
  .page p, .page li { max-width: 46ch; }
  .plain { display: grid; gap: 8px; padding-left: 1.2em !important; list-style: disc !important; }
  .plain li::marker { color: var(--jade); }
  .qlist { display: grid; gap: 4px; margin-top: 10px; }
  .qlist h3 { font: 600 1rem/1.3 var(--display); color: var(--jade); margin-top: 12px; }
  .qlist li { color: var(--lago-400); font-size: .97rem; }
  .field-row { display: grid; gap: 6px; }
  .field-row label { font-weight: 600; }
  .input { width: 100%; min-height: 3.2rem; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--lago-400); background: var(--blanco); color: var(--lago); font-size: 1.0625rem; }
  .input:focus { border-color: var(--lago); outline: none; box-shadow: 0 0 0 3px var(--lago-100); }
  .mono { font: .95rem/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--jade); word-break: break-all; }
  .tool {
    min-width: 48px; min-height: 44px; padding: 0 12px; border-radius: 12px;
    border: 1.5px solid var(--lago-400); background: transparent; color: var(--lago);
    font: 600 1rem/1 var(--display); display: inline-grid; place-items: center; transition: background .25s var(--ease), color .25s var(--ease);
  }
  .tool[aria-pressed="true"] { background: var(--lago); color: var(--arena); border-color: var(--lago); }
  .tool svg { width: 22px; height: 22px; }
  .tools { display: inline-flex; gap: 8px; flex: none; }
  a.tool { text-decoration: none; }
  @media (hover: hover) { a.tool.ig:hover { color: var(--arcilla-600); border-color: var(--arcilla-600); } }
  .headline { font: 700 min(13.4vw, 80px)/1.02 var(--display); letter-spacing: -.035em; text-wrap: balance; margin-top: 8px; }
  .headline em { font: italic 400 1.04em/1 var(--voz); letter-spacing: -.01em; color: var(--jade); }
  .headline.small { font-size: min(11vw, 60px); line-height: 1.04; }
  .lede { font-size: 1.15rem; line-height: 1.45; color: var(--lago-400); max-width: 34ch; }
  .track-space { flex: 1 0 clamp(120px, 24svh, 330px); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 20px; font-weight: 600; }
  .facts li { display: flex; align-items: center; gap: 8px; }
  .facts li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--jade); }
  .kidnote { color: var(--lago-400); max-width: 40ch; }
  .go {
    width: 100%; min-height: 3.6rem; border: 0; border-radius: var(--r);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--arcilla); color: var(--blanco);
    font: 700 1.1875rem/1 var(--body);
    transition: transform .25s var(--ease), background-color .25s var(--ease);
  }
  .go:active { transform: translateY(1px) scale(.99); }
  @media (hover: hover) { .go:hover { background: var(--arcilla-600); } }
  .quiet { background: none; border: 0; color: var(--lago); font-weight: 600; padding: 12px 4px; text-decoration: underline; text-decoration-color: var(--lago-300); text-underline-offset: 4px; }
  .actions { display: grid; gap: 4px; position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 1; }

  /* ───────── Pantalla de pregunta ───────── */
  .q { flex: 1; display: flex; flex-direction: column; }
  .band { background: var(--blanco); border-bottom: 1px solid var(--niebla-300); }
  .band .topbar { padding-top: 8px; }
  .band-track { position: relative; height: 46px; }
  .band-track canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .band-cap { display: flex; justify-content: space-between; gap: 12px; padding-block: 2px 12px; font-size: 1rem; color: var(--lago-400); }
  .band-cap b { color: var(--lago); font: 600 1rem/1.3 var(--display); }
  .qbody { display: grid; gap: 14px; padding-block: 28px 12px; }
  .q-title { font: 600 clamp(1.5rem, 6.2vw, 2rem)/1.2 var(--display); letter-spacing: -.02em; text-wrap: balance; outline: none; }
  .q-help { color: var(--lago-400); max-width: 42ch; }
  .opts { display: grid; gap: 10px; margin-top: 8px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 3.75rem; padding: 14px 16px;
    text-align: left; font-size: 1.0625rem; line-height: 1.3; font-weight: 500;
    background: var(--blanco); color: var(--lago); border: 1.5px solid var(--lago-300); border-radius: var(--r);
    transition: background-color .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
  }
  .opt .lbl { min-width: 0; flex: 1; }
  .opt .ind { flex: none; width: 24px; height: 24px; border: 2px solid var(--lago-400); display: grid; place-items: center; transition: inherit; }
  .opt[role="radio"] .ind { border-radius: 50%; }
  .opt[role="checkbox"] .ind { border-radius: 7px; }
  .opt .ind svg { width: 16px; height: 16px; opacity: 0; color: var(--lago); }
  .opt[aria-checked="true"] { background: var(--lago); border-color: var(--lago); color: var(--arena); font-weight: 600; }
  .opt[aria-checked="true"] .ind { border-color: var(--arena); background: var(--arena); }
  .opt[role="radio"][aria-checked="true"] .ind { box-shadow: inset 0 0 0 5px var(--arena); background: var(--lago); }
  .opt[role="checkbox"][aria-checked="true"] .ind svg { opacity: 1; }
  .opt[aria-disabled="true"] { opacity: .42; }
  .opt .lbl small { display: block; margin-top: 3px; font-size: .92rem; font-weight: 400; color: var(--lago-400); }
  .opt[aria-checked="true"] .lbl small { color: var(--arena); opacity: .8; }
  @media (hover: hover) { .opt:not([aria-checked="true"]):not([aria-disabled="true"]):hover, .tile:not([aria-checked="true"]):not([aria-disabled="true"]):hover, .chip:not([aria-checked="true"]):hover { border-color: var(--lago); } }

  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
  .tiles > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    min-height: 8.5rem; padding: 16px 10px; text-align: center;
    background: var(--blanco); color: var(--lago); border: 1.5px solid var(--lago-300); border-radius: 18px;
    font: 600 1.0625rem/1.2 var(--display);
    transition: background-color .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
  }
  .tile svg { width: 44px; height: 44px; color: var(--jade); transition: color .25s var(--ease); }
  .tile[aria-checked="true"] { background: var(--lago); border-color: var(--lago); color: var(--arena); }
  .tile[aria-checked="true"] svg { color: var(--arena); }
  .tile[aria-disabled="true"] { opacity: .42; }

  .textarea {
    width: 100%; min-height: 9rem; padding: 14px 16px; border-radius: var(--r);
    border: 1.5px solid var(--lago-400); background: var(--blanco); color: var(--lago);
    font-size: 1.0625rem; line-height: 1.45; resize: vertical;
  }
  .textarea::placeholder { color: var(--lago-400); opacity: .85; }
  .textarea:focus { border-color: var(--lago); outline: none; box-shadow: 0 0 0 3px var(--lago-100); }
  .count { justify-self: end; font-size: 1rem; color: var(--lago-400); font-variant-numeric: tabular-nums; }
  .hint { color: var(--arcilla-600); min-height: 1.4em; font-weight: 600; }

  .dock {
    position: sticky; bottom: 0; margin-top: auto;
    padding-block: 18px calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to bottom, rgba(243, 239, 231, 0), var(--arena) 28%);
  }
  .next {
    width: 100%; min-height: 3.6rem; border-radius: var(--r); border: 0;
    background: var(--arcilla); color: var(--blanco);
    font: 700 1.1875rem/1 var(--body); transition: background-color .25s var(--ease);
  }
  @media (hover: hover) { .next:not([aria-disabled="true"]):hover { background: var(--arcilla-600); } }
  .next[aria-disabled="true"] { background: var(--niebla-300); color: var(--lago-400); cursor: not-allowed; }

  /* ───────── Después de la meta ───────── */
  .after { display: grid; gap: 30px; padding-block: 30px 44px; }
  .after h2 { font: 700 2rem/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  .after h3 { font: 600 1.3rem/1.2 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  .after p { max-width: 42ch; }
  .muted { color: var(--lago-400); }
  .send { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: var(--r); background: var(--blanco); border: 1px solid var(--niebla-300); }
  .send .dot { flex: none; width: 12px; height: 12px; margin-top: 6px; border-radius: 50%; background: var(--lago-300); }
  .send[data-s="ok"] .dot { background: var(--jade); }
  .send[data-s="sending"] .dot { background: var(--lago); animation: blink 1s ease-in-out infinite; }
  .send[data-s="offline"] .dot, .send[data-s="error"] .dot { background: var(--arcilla-600); }
  .send .msg { display: grid; gap: 8px; }
  .ticks { display: grid; gap: 12px; }
  .ticks li { display: flex; gap: 12px; align-items: flex-start; }
  .ticks svg { flex: none; width: 22px; height: 22px; color: var(--jade); margin-top: 2px; }
  .share-row { display: grid; gap: 10px; }
  .ghost {
    width: 100%; min-height: 3.3rem; border-radius: var(--r); border: 1.5px solid var(--lago);
    background: transparent; color: var(--lago); font: 600 1.05rem/1 var(--body);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; transition: background .25s var(--ease);
  }
  @media (hover: hover) { .ghost:hover { background: var(--lago-100); } }
  .ghost svg { width: 20px; height: 20px; }
  .go.as-link { text-decoration: none; }
  .go svg { width: 22px; height: 22px; }
  .share-text { width: 100%; min-height: 6rem; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--lago-400); background: var(--blanco); color: var(--lago); font-size: 1rem; line-height: 1.4; resize: none; }
  details.raw { border-top: 1px solid var(--niebla); padding-top: 16px; }
  details.raw summary { cursor: pointer; font-weight: 600; color: var(--lago-400); }
  details.raw pre { margin: 12px 0 0; padding: 14px; border-radius: 12px; background: var(--blanco); border: 1px solid var(--niebla-300); overflow-x: auto; font: .8rem/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .link { background: none; border: 0; padding: 10px 0; color: var(--lago); font-weight: 600; text-decoration: underline; text-decoration-color: var(--lago-300); text-underline-offset: 4px; justify-self: start; }

  .promise { font-weight: 600; color: var(--lago); max-width: 40ch; }
  .promise b { color: var(--jade); font-weight: 600; }
  .cheer { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--jade-100); border: 1px solid var(--jade-200); animation: cheerIn .5s var(--ease) both; }
  .cheer svg { flex: none; width: 26px; height: 26px; color: var(--jade); }
  .cheer b { color: var(--jade); }
  .medal { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 24px 20px; border-radius: 20px; background: var(--blanco); border: 1px solid var(--niebla-300); }
  .medal svg { width: 150px; height: auto; display: block; }
  .medal .stack { justify-items: center; }
  .medal p { margin-inline: auto; }
  .medal h2 { font-size: 1.7rem; }
  .shine { position: relative; }
  @keyframes cheerIn { from { opacity: .4; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .enter { animation: settle .5s var(--ease) both; }
  @keyframes settle { from { opacity: .35; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .enter, .send .dot, .cheer { animation: none !important; } .go, .opt, .tile { transition: none; } }
  @media (min-width: 720px) { .wrap { max-width: 38rem; } }

  /* ───────── Invitación a compartir: visible, sin estorbar ───────── */
  .nudge {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 2px; text-align: left;
    background: none; border: 0; border-top: 1px solid var(--niebla-300); color: var(--lago-400); font-size: .98rem; line-height: 1.35;
  }
  .nudge b { color: var(--lago); font-weight: 600; }
  .nudge svg { flex: none; width: 22px; height: 22px; color: var(--jade); }
  .nudge .chev { width: 18px; height: 18px; margin-left: auto; color: var(--lago-300); }
  @media (hover: hover) { .nudge:hover b { text-decoration: underline; text-underline-offset: 3px; } }
  .spread { display: grid; gap: 12px; padding: 20px 18px; border-radius: 20px; background: var(--blanco); border: 1px solid var(--niebla-300); }
  .eyebrow { font: 500 .75rem/1.1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--arcilla-600); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--lago-300); background: var(--blanco); color: var(--lago); font-weight: 500; font-size: .98rem; }
  .chip[aria-checked="true"] { background: var(--lago); border-color: var(--lago); color: var(--arena); font-weight: 600; }
  .kit { display: grid; gap: 14px; }
  .preview { display: grid; place-items: center; padding: 18px; border-radius: 20px; background: var(--niebla-200); border: 1px solid var(--niebla-300); min-height: 220px; }
  .preview img { display: block; width: 100%; max-width: 250px; height: auto; border-radius: 14px; box-shadow: 0 22px 40px -24px rgba(18, 56, 59, .45), 0 0 0 1px rgba(18, 56, 59, .08); }
  .preview[data-f="post"] img { max-width: 290px; }

  /* ───────── La lista de espera y lo que viene (al final) ───────── */
  .wl .go { margin-top: 4px; }
  /* muestra del sello: una sola pasada de brillo al aparecer; nada se mueve con movimiento reducido */
  .badge-demo { margin: 4px 0 0; display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--arena); border: 1px dashed var(--lago-300); }
  .badge-demo figcaption { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 600 .95rem/1.2 var(--display); color: var(--lago); }
  .badge-demo .tag { padding: 3px 9px; border-radius: 999px; background: var(--niebla-200); color: var(--lago-400); font: 500 .7rem/1.3 var(--display); letter-spacing: .14em; text-transform: uppercase; }
  .bd-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--blanco); border: 1px solid var(--niebla-300); }
  .bd-avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--lago); color: var(--arena); }
  .bd-avatar svg { width: 22px; height: 22px; }
  .bd-who { display: grid; gap: 2px; min-width: 0; }
  .bd-who b { font: 600 1.02rem/1.2 var(--display); color: var(--lago); }
  .bd-who span { font-size: .9rem; color: var(--lago-400); }
  .bd-badge { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 999px; background: var(--lago); color: var(--arena); justify-self: start; max-width: 100%; animation: settle .5s var(--ease) both; }
  .bd-badge svg { flex: none; width: 40px; height: 40px; }

  // ───────── Motivación: tiempo que falta y puestos de abastecimiento; lo que hay al final no se adelanta ─────────
  const SECS_PER_Q = 16;
  function timeLeft() {
    const { path } = walk();
    const left = path.length - Math.max(0, path.indexOf(state.current));
    if (left <= 1) return 'Última pregunta';
    return 'Faltan ~' + Math.max(1, Math.round((left * SECS_PER_Q) / 60)) + ' min';
  }
  const CHEERS = {
    quarter: ['Buen ritmo.', 'Ya llevás un cuarto del recorrido.'],
    half: ['Vas por la mitad.', 'Lo mejor está en la meta.'],
    last: ['Último tramo.', 'Ya casi llegás a la meta.']
  };
  // Se llama al llegar a una pregunta nueva: deja un mensaje si cruzó un hito que aún no había visto
  function checkMilestone() {
    state.cheer = null;
    if (Q[state.current].type === 'info') return;
    const { path } = walk();
    const i = Math.max(0, path.indexOf(state.current)), left = path.length - i, p = i / path.length;
    const seen = (k) => state.milestones.includes(k);
    let k = null;
    if (left <= 3 && path.length > 8 && !seen('last')) k = 'last';
    else if (p >= 0.5 && !seen('half')) k = 'half';
    else if (p >= 0.25 && p < 0.5 && !seen('quarter')) k = 'quarter';
    if (!k) return;
    state.milestones.push(k);
    state.cheer = k;
    setTimeout(() => announce(CHEERS[k].join(' ')), 400);
  }
  function cheerBox() {

    const { path } = walk();

    return { version: VERSION, path: state.answers.O2 === '0' ? 'planea' : 'activo', channel: state.channel, ref: REF, answers: out, client_id: state.clientId || uuid() };

    return pageShell(
      '<section><h1 tabindex="-1" id="qt">Quiénes somos</h1>' +
        '<p>' + BRAND + ' es un proyecto nicaragüense e independiente. Estamos creando una app donde los corredores tendrán su perfil y los organizadores el suyo, para publicar sus carreras de running e inscribir a su gente.</p>' +
        '<p>Antes de construir la parte de organizadores queremos escuchar a quienes organizan, para que responda a lo que de verdad pasa en un evento y no a lo que nosotros suponemos.</p>' +
        contactHTML() + '</section>' +
      '<section><h2>Para qué sirven tus respuestas</h2>' +
        '<p>Para decidir qué construimos primero para quienes organizan. Si hoy todo te funciona bien, también nos sirve saberlo.</p>' +
        '<p>No te vamos a vender nada.</p></section>' +
      '<section><h2>Qué preguntamos y qué no</h2><ul class="plain">' +
        '<li>Tus respuestas son anónimas: no pedimos nombre, cédula, teléfono ni correo.</li>' +
        '<li>Preguntamos por tu último evento real (tamaño, precios, inscripciones, pagos, kits y patrocinios), siempre en rangos.</li>' +
        '<li>Al final, solo si querés, podés dejar tu contacto. Si lo dejás, tus respuestas quedan unidas a ese contacto.</li>' +
        '<li>Contamos las visitas al sitio solo como sumas por día y canal: sin cookies, sin dirección IP ni nada que te identifique.</li></ul>' +
        questionList() + '</section>' +
      '<section id="privacidad"><h2>Si dejás tu contacto</h2><ul class="plain">' +
        '<li><b>Responsable:</b> ' + esc(PRIVACY.controller) + '.</li>' +
        '<li><b>Qué guardamos:</b> tu nombre, tu WhatsApp o tu correo, tu organización y tu próximo evento si los escribiste, lo que marcaste que te interesa y cómo preferís conversar.</li>' +
        '<li><b>Para qué:</b> para escribirte sobre lo que marcaste. No vendemos ni compartimos tus datos.</li>' +
        '<li><b>Dónde:</b> en una base de datos de Supabase, en servidores de Estados Unidos, con acceso solo del equipo de ' + BRAND + '.</li>' +
        '<li><b>Cuánto tiempo:</b> ' + esc(PRIVACY.retention) + '</li>' +
        '<li><b>Tus derechos:</b> podés pedir ver, corregir o borrar tus datos, o retirar tu permiso, cuando quieras (Ley 787 de Protección de Datos Personales). Escribinos a <a href="' + esc(CONTACT.href) + '" target="_blank" rel="noopener">' + esc(CONTACT.label) + '</a>.</li>' +
        '<li><b>Versión del aviso:</b> ' + CONSENT_VERSION + '.</li></ul></section>' +
      '<section><h2>Quién ve las respuestas</h2>' +
        '<p>Solo el equipo de ' + BRAND + '. Si publicamos resultados, serán cifras generales, nunca respuestas de una persona ni de un evento con nombre.</p></section>' +
      '<div class="stack"><button type="button" class="go" data-act="home">Volver a la encuesta</button></div>');
  }

  function render(dir) {
    if (state.view === 'done') hit('encuesta_fin', true);
    scenes.forEach((s) => s.destroy()); scenes = [];
    document.documentElement.classList.toggle('big', state.big);
    let html;
    if (state.view === 'welcome') html = viewWelcome();
    else if (state.view === 'done') html = viewDone();
    else if (state.view === 'about') html = viewAbout();
    else if (state.view === 'contact') html = viewContact();
    else if (state.view === 'sent') html = viewSent();
    else html = Q[state.current].type === 'info' ? viewInfo(state.current) : viewQuestion(state.current);
    app.innerHTML = html;
    if (dir === 'same') app.querySelectorAll('.enter').forEach((el) => el.classList.remove('enter'));
    app.querySelectorAll('[data-scene]').forEach((sec) => scenes.push(new TrackScene(sec, { finish: sec.dataset.scene === 'finish' })));
    const band = app.querySelector('.band-track');
    if (band && state.view === 'q') {
      const { p, path } = progress();
      const marks = []; let prevB = null;
      path.forEach((id, i) => { if (Q[id].b !== prevB) { marks.push(i / path.length); prevB = Q[id].b; } });
      scenes.push(new BandScene(band, p, dir === 'same' ? p : lastProgress, marks));
      lastProgress = p;
    } else if (state.view === 'welcome') lastProgress = 0;
    const title = app.querySelector('#qt');
    if (title && dir !== 'same') title.focus({ preventScroll: true });
    save();
  }

  // ───────── Acciones ─────────
  function say(msg) { state.hint = msg; render('same'); announce(msg); }
  function pushHistory(id) { if (state.history[state.history.length - 1] !== id) state.history.push(id); }
  function goNext() {
    if (state.view !== 'q') return;
    const q = Q[state.current], a = state.answers[state.current];
    if (q.optional && !isAnswered(q, a)) delete state.answers[state.current]; // saltada: no se guarda nada
    else if (q.type !== 'info' && !isAnswered(q, a)) {
      say(q.type === 'text' || q.type === 'short' ? 'Escribí al menos una palabra para seguir.' : 'Elegí una opción para seguir. Si no te acordás, elegí «No sé o no me acuerdo».');
      return;
    }
    const nx = nextOf(state.current, a);
    state.hint = '';
    pushHistory(state.current);
    if (nx === 'END') {
      state.final = finalAnswers();
      state.cheer = null;
      state.send = 'sending';
      state.view = 'done';
      render(); window.scrollTo(0, 0); announce('Llegaste a la meta.');
      enqueue('resp', state.final.client_id, state.final);
      return;
    }
    // quien la llena hablando con el equipo (?c=reunion) ya trae marcada la respuesta, y la puede cambiar
    if (nx === 'Z2' && state.channel === 'reunion' && state.answers.Z2 == null) state.answers.Z2 = 'reunion';
    state.current = nx; checkMilestone(); render(); window.scrollTo(0, 0);
  }
  // Páginas de quiénes somos y de contacto: se abren encima de donde estabas y vuelven ahí
  const isPage = () => state.view === 'about';
  function openPage(v, hash) {
    if (!isPage()) state.prevView = state.view;
    state.view = v; render(); window.scrollTo(0, 0);
    if (hash) { const el = document.getElementById(hash); if (el) el.scrollIntoView(); }
  }
  function closePage() {
    state.view = state.prevView || 'welcome'; state.prevView = null;
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    render(); window.scrollTo(0, 0);
  }
  function goBack() {
    state.hint = '';
    if (isPage()) { closePage(); return; }
    if (state.view === 'contact' || state.view === 'sent') { readLead(); state.view = 'done'; render(); window.scrollTo(0, 0); return; }
    if (state.view === 'done') { state.view = 'welcome'; render(); return; }
    if (state.history.length) { state.current = state.history.pop(); render(); window.scrollTo(0, 0); }
    else { state.view = 'welcome'; render(); }
  }
  function restart() {
    try { localStorage.removeItem(STORE); } catch (e) {}
    Object.assign(state, { answers: {}, history: [], current: 'O1', hint: '', final: null, send: 'idle', shareFallback: false, view: 'q', clientId: uuid(), milestones: [], cheer: null,
      form: freshForm(), lead: {}, leadSent: false, leadSend: 'idle' });
    lastProgress = 0; render(); window.scrollTo(0, 0);
  }
  function pick(v) {
    const id = state.current, q = Q[id];
    if (q.type === 'single') { state.answers[id] = v; state.hint = ''; render('same'); return; }
    const cur = (state.answers[id] || []).slice();
    const op = q.options.find((x) => x.v === v);
    let next;
    if (cur.includes(v)) next = cur.filter((x) => x !== v);
    else if (op.ex) next = [v];
    else {
      next = cur.filter((x) => !(q.options.find((y) => y.v === x) || {}).ex);
      if (q.max && next.length >= q.max) { say('Podés elegir hasta ' + q.max + '. Quitá una para cambiarla.'); return; }
      next.push(v);
    }
    state.hint = '';
    if (next.length) state.answers[id] = next; else delete state.answers[id];
    render('same');
  }

  // ───────── Contacto: validar y enviar ─────────
  const val = (id) => { const el = document.getElementById('f-' + id); return el ? el.value : (state.lead[id] || ''); };
  function readLead() {
    if (state.view !== 'contact') return;
    const ok = document.getElementById('f-ok');
    state.lead = { name: val('name'), org: val('org'), wa: val('wa'), mail: val('mail'), next: val('next'), ok: !!ok && ok.getAttribute('aria-checked') === 'true' };
  }
  const cleanName = (v) => String(v || '').replace(/[­​-‏⁠-⁤﻿]/g, '').trim().replace(/\s+/g, ' ');
  // el mismo criterio que la lista de espera: Nicaragua son 8 dígitos que empiezan con 2, 5, 7 u 8; otro país, + y el código
  function normPhone(v) {
    let d = String(v || '').replace(/[^\d+]/g, '');
    if (d.startsWith('00')) d = '+' + d.slice(2);
    if (d.startsWith('+')) {
      const g = d.slice(1).replace(/\D/g, '');
      if (g.startsWith('505')) return /^505[2578]\d{7}$/.test(g) ? '+' + g : null;
      return g.length >= 10 && g.length <= 15 && g[0] !== '0' ? '+' + g : null;
    }
    d = d.replace(/\D/g, '');
    if (/^[2578]\d{7}$/.test(d)) return '+505' + d;
    if (/^505[2578]\d{7}$/.test(d)) return '+' + d;
    return null;
  }
  const normEmail = (v) => { v = String(v || '').trim().toLowerCase(); return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(v) && v.length <= 254 ? v : null; };
  function submitLead() {
    readLead();
    const L = state.lead, f = state.form;
    const errs = [];
    const set = (id, msg) => { const e = document.getElementById(id); if (e) e.textContent = msg; if (msg) errs.push(id); };
    set('e-int', f.interests.length ? '' : 'Elegí al menos una opción.');
    const name = cleanName(L.name);
    set('e-name', name.length >= 2 && /[\p{L}\p{N}]/u.test(name) ? '' : 'Escribí tu nombre.');
    const wa = L.wa.trim() ? normPhone(L.wa) : null, mail = L.mail.trim() ? normEmail(L.mail) : null;
    set('e-contact', !L.wa.trim() && !L.mail.trim() ? 'Dejanos tu WhatsApp o tu correo.'
      : L.wa.trim() && !wa ? 'Revisá el número: son 8 dígitos, como 8888 8888. Si no es de Nicaragua, empieza con + y el código del país.'
      : L.mail.trim() && !mail ? 'Revisá el correo: falta algo, como la @ o el dominio.' : '');
    set('e-ok', L.ok ? '' : 'Necesitamos tu permiso para guardar tus datos.');
    if (errs.length) {
      const first = { 'e-int': '[data-int]', 'e-name': '#f-name', 'e-contact': L.wa.trim() && !wa ? '#f-wa' : L.mail.trim() && !mail ? '#f-mail' : '#f-wa', 'e-ok': '#f-ok' }[errs[0]];
      const el = app.querySelector(first); if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
      announce('Revisá ' + (errs.length === 1 ? 'un dato' : errs.length + ' datos') + ' del formulario.');
      return;
    }
    const btn = document.getElementById('lead-go'); if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }
    const talk = f.interests.includes('fundador') || f.interests.includes('llamada');
    state.leadSent = true; state.leadSend = 'sending';
    hit('contacto');
    enqueue('lead', state.final.client_id, { p_client_id: state.final.client_id, p_name: name.slice(0, 80), p_organization: L.org.trim().slice(0, 100) || null,
      p_whatsapp: wa, p_email: mail, p_interests: f.interests, p_meet: talk ? f.meet : null, p_slot: talk ? f.slot : null, p_next_event: talk ? (L.next.trim().slice(0, 80) || null) : null,
      p_consent_version: CONSENT_VERSION, p_channel: state.channel, p_ref: REF });
  }
  function leadOutcome(s) {
    state.leadSend = s;
    if (s === 'ok' || s === 'offline') { if (state.view === 'contact') { state.view = 'sent'; render(); window.scrollTo(0, 0); } return; }
    state.leadSent = false;
    const btn = document.getElementById('lead-go'); if (btn) { btn.disabled = false; btn.textContent = 'Enviar'; }
    const e = document.getElementById('form-err'); if (e) e.textContent = 'No pudimos guardar tus datos. Revisá el número o el correo e intentá de nuevo.';
  }

  app.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const act = b.dataset.act;
    if (b.dataset.int) {
      const v = b.dataset.int, arr = state.form.interests;
      state.form.interests = arr.includes(v) ? arr.filter((x) => x !== v) : arr.concat([v]);
      b.setAttribute('aria-checked', state.form.interests.includes(v));
      const t = document.getElementById('talk'); if (t) t.hidden = !(state.form.interests.includes('fundador') || state.form.interests.includes('llamada'));
      const er = document.getElementById('e-int'); if (er) er.textContent = '';
      return;
    }
    if (b.dataset.meet || b.dataset.slot) {
      const grp = b.dataset.meet ? 'meet' : 'slot';
      state.form[grp] = b.dataset[grp];
      app.querySelectorAll('[data-' + grp + ']').forEach((x) => x.setAttribute('aria-checked', x === b));
      return;
    }
    if (b.dataset.ok) {
      const on = b.getAttribute('aria-checked') !== 'true';
      b.setAttribute('aria-checked', on);
      const er = document.getElementById('e-ok'); if (er) er.textContent = '';
      return;
    }
    if (b.dataset.v) {
      const v = b.dataset.v;
      if (b.getAttribute('aria-disabled') === 'true') say('Podés elegir hasta ' + Q[state.current].max + '. Quitá una para cambiarla.');
      else pick(v);
      const again = app.querySelector('[data-v="' + v + '"]'); if (again) again.focus({ preventScroll: true });
      return;
    }
    if (act === 'start') { hit('encuesta_inicio'); state.view = 'q'; state.current = 'O1'; state.clientId = uuid(); state.milestones = []; state.cheer = null; render(); window.scrollTo(0, 0); }
    else if (act === 'resume') { hit('encuesta_reanudada'); state.view = 'q'; if (!state.clientId) state.clientId = uuid(); render(); }
    else if (act === 'about') openPage('about');
    else if (act === 'privacy') { readLead(); openPage('about', 'privacidad'); }
    else if (act === 'home') { if (state.view === 'sent') { state.view = 'done'; render(); window.scrollTo(0, 0); } else closePage(); }
    else if (act === 'contact') { state.view = 'contact'; render(); window.scrollTo(0, 0); }
    else if (act === 'restart') restart();
    else if (act === 'next') goNext();
    else if (act === 'back') goBack();
    else if (act === 'retry') { setSend('sending'); flush(); }
    else if (act === 'big') { readLead(); state.big = !state.big; render('same'); const t = app.querySelector('[data-act="big"]'); if (t) t.focus({ preventScroll: true }); announce(state.big ? 'Letra grande activada.' : 'Letra normal.'); }
    else if (act === 'copy') {
      const ok = () => { b.lastChild.textContent = 'Enlace copiado'; announce('Enlace copiado. Pegalo en WhatsApp o donde querás.'); };
      const fail = () => {
        state.shareFallback = true; render('same');
        const ta = document.getElementById('share-text');
        if (ta) { ta.focus({ preventScroll: true }); ta.select(); ta.scrollIntoView({ block: 'center' }); }
        announce('No se pudo copiar solo. El texto quedó seleccionado para que lo copies.');
      };
      hit('copiar_enlace');
      try { navigator.clipboard.writeText(inviteText()).then(ok, fail); } catch (err) { fail(); }
    }
  });
  app.addEventListener('submit', (e) => { if (e.target.id === 'lead') { e.preventDefault(); submitLead(); } });
  app.addEventListener('input', (e) => {
    if (/^f-(wa|mail)$/.test(e.target.id)) { const er = document.getElementById('e-contact'); if (er) er.textContent = ''; return; }
    if (e.target.id === 'f-name') { const er = document.getElementById('e-name'); if (er) er.textContent = ''; return; }
    if (e.target.id !== 'ta') return;
    const v = e.target.value; if (v.trim()) state.answers[state.current] = v; else delete state.answers[state.current];
    const c = document.getElementById('count'); if (c) c.textContent = v.length + ' de 600';
    const btn = app.querySelector('.dock [data-act="next"]');
    if (btn) {
      if (isAnswered(Q[state.current], v) || Q[state.current].optional) btn.removeAttribute('aria-disabled'); else btn.setAttribute('aria-disabled', 'true');
      btn.textContent = nextLabel(state.current);
    }
    save();
  });
  // Enter en el campo corto sigue a la siguiente pregunta
  app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'ta' && e.target.tagName === 'INPUT') { e.preventDefault(); goNext(); } });
  // iPhone: con el teclado abierto la barra de «Siguiente» deja de flotar y no tapa el campo
  const isField = (el) => !!el && /^(INPUT|TEXTAREA)$/.test(el.tagName);
  function keyboardCheck() {
    const vv = window.visualViewport, el = document.activeElement;
    const open = isField(el) && (!vv || innerHeight - vv.height > 120 || matchMedia('(pointer: coarse)').matches);
    document.documentElement.classList.toggle('kb', open);
    if (open && vv && innerHeight - vv.height > 120) setTimeout(() => { if (document.activeElement === el) el.scrollIntoView({ block: 'center' }); }, 80);
  }
  if (window.visualViewport) visualViewport.addEventListener('resize', keyboardCheck);
  document.addEventListener('focusin', (e) => { if (isField(e.target)) keyboardCheck(); });
  document.addEventListener('focusout', () => setTimeout(keyboardCheck, 120));
  window.addEventListener('online', () => flush());

  load();
  // Enlace directo: #quienes
  if (location.hash === '#quienes') openPage('about'); else render();
  if (state.channel === 'prueba') window.__org = { state, Q, walk, render, go: (id) => { state.view = 'q'; state.current = id; render(); } };
  flush(); // envía respuestas que quedaron pendientes en este teléfono
})();
</script>
</body>
</html>
